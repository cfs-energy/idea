[default.extend-words]
# the stem of an escaped accented word in two JSON fixtures
caf = "caf"
CLEA = "CLEA"
Pn = "Pn"
Ded = "Ded"
onfigure = "onfigure"
# the bolded initial in "**I**ntegrated" leaves the stem
ntegrated = "ntegrated"
# the PyPI package name
certifi = "certifi"
# a prefix check on the word terminate/terminating
terminat = "terminat"
braket = "braket"
Sur = "Sur"

[default]
extend-ignore-re = [
  "ami-[0-9a-f]+",
  # the r7iz EC2 instance family
  "\\br7iz\\b",
  "fs-[0-9a-f]+",
  # CDK logical ids end in an eight-character hex hash whose letters read as words.
  "[a-z]+[0-9A-F]{8}\\b",
  # Cloudscape class names are generated and carry a per-release build hash.
  "awsui_[A-Za-z0-9_]+",
  # ASCII-armoured PGP key bodies are base64, not prose.
  "(?m)^[A-Za-z0-9+/]{64}$"
]
