name: 'Setup Development Environment'
description: 'Sets up Python, Node.js and development dependencies from mise.toml'
outputs:
  python-version:
    description: 'The Python version that was installed'
    value: ${{ steps.versions.outputs.python_version }}
  node-version:
    description: 'The Node.js version that was installed'
    value: ${{ steps.versions.outputs.node_version }}
runs:
  using: 'composite'
  steps:
    - name: Install pinned development tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.10.19
      env:
        MISE_ENV: legacy
    - name: Read installed versions
      id: versions
      shell: bash
      run: |
        echo "python_version=$(python -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
        echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
        echo "MISE_ENV=legacy" >> "$GITHUB_ENV"
    - name: Setup DynamoDB Local
      uses: ./.github/actions/setup_dynamodb_local
    - name: Install AWS CLI
      shell: bash
      # Unpack outside the checkout: the installer expands to an aws/ directory of about
      # 25,000 files, which every tool that walks the working tree would read as project files.
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "${RUNNER_TEMP}/awscliv2.zip"
        unzip -q "${RUNNER_TEMP}/awscliv2.zip" -d "${RUNNER_TEMP}"
        sudo "${RUNNER_TEMP}/aws/install" --update
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libldap2-dev libsasl2-dev coreutils locales
    - name: Configure locale
      shell: bash
      run: |
        sudo locale-gen en_US.UTF-8
        sudo update-locale LANG=en_US.UTF-8
        echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV
        echo "LC_CTYPE=en_US.UTF-8" >> $GITHUB_ENV
        echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
    - name: Locate Yarn cache
      id: yarn-cache
      shell: bash
      run: echo "path=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
    - name: Cache Yarn downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.yarn-cache.outputs.path }}
        key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node_version }}-${{ hashFiles('source/idea/idea-cluster-manager/webapp/yarn.lock') }}
        restore-keys: |
          yarn-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node_version }}-
    - name: Cache virtual environment
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: cache-venv
      with:
        path: venv
        key: venv-clean-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.python_version }}-${{ hashFiles('requirements/dev.txt') }}
    - name: Create virtual environment
      if: steps.cache-venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install -r requirements/dev.txt
    - name: Activate virtual environment
      shell: bash
      run: |
        echo "VIRTUAL_ENV=$PWD/venv" >> $GITHUB_ENV
        echo "$PWD/venv/bin" >> $GITHUB_PATH
