name: Unit Tests
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        suite: [data-model, sdk, cluster-manager, scheduler, virtual-desktop-controller, web-portal]
    runs-on: ubuntu-large
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Development Environment
        uses: ./.github/actions/setup_dev_environment
      - name: Run ${{ matrix.suite }} tests
        env:
          SUITE: ${{ matrix.suite }}
        run: mise run "test:$SUITE"
  # Keep the required "test" check stable while suites run in parallel.
  test:
    if: always()
    needs: suites
    runs-on: ubuntu-24.04
    steps:
      - name: Require every suite to pass
        env:
          RESULT: ${{ needs.suites.result }}
        run: test "$RESULT" = success
