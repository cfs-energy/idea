name: Unit Tests
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-large
    steps:
      - uses: actions/checkout@v7
      - name: Setup Development Environment
        uses: ./.github/actions/setup_dev_environment
      - name: SDK Tests
        run: |
          invoke tests.sdk
      - name: Cluster Manager Tests
        run: |
          invoke tests.cluster-manager
      - name: Scheduler Tests
        run: |
          invoke tests.scheduler
      - name: Virtual Desktop Controller Tests
        run: |
          invoke tests.virtual-desktop-controller
      - name: Web Portal Tests
        run: |
          invoke tests.web-portal
