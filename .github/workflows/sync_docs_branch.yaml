name: Sync docs branch
# The GitBook space syncs with the gitbook branch, because main accepts pull requests only.
# Fast-forward gitbook to main so repository edits reach GitBook, and when gitbook is ahead
# because edits were merged in the GitBook editor, open the pull request that carries them
# back. The built-in token is enough: a pull request it creates triggers no workflows.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fast-forward gitbook to main
        id: fast_forward
        continue-on-error: true
        run: git push origin main:gitbook
      - name: Open the docs pull request when gitbook is ahead
        if: steps.fast_forward.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --head gitbook --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "docs pull request #$existing is already open"
            exit 0
          fi
          gh pr create --base main --head gitbook \
            --title "docs: changes from GitBook" \
            --body "Edits merged in the GitBook editor, synced from the gitbook branch."
