name: ideactl checks
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-large
    defaults:
      run:
        working-directory: source/idea/ideactl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: A release pull request carries its version
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ github.token }}
        run: bash source/idea/ideactl/scripts/assert-release-pr.sh
      - name: Detect release inputs
        id: inputs
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-inputs.sh
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.8.2"
          cache: npm
          cache-dependency-path: source/idea/ideactl/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the test oracles
        # flatten.py and the Jinja2 rendering oracle are Python; the settings-sync tests run
        # against DynamoDB Local at the path the suite looks for.
        run: |
          python3 -m pip install 'jinja2==3.1.6' 'PyYAML==6.0.3'
          mkdir -p ~/.idea/lib/dynamodb-local
          curl -fsSL https://d1ni2b6xgvw0s0.cloudfront.net/v2.x/dynamodb_local_latest.tar.gz | tar -xz -C ~/.idea/lib/dynamodb-local
      - name: Check package version
        run: |
          PACKAGE_VERSION=$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')
          RELEASE_VERSION=$(tr -d '[:space:]' < ../../../IDEA_VERSION.txt)
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::ideactl package version ${PACKAGE_VERSION} does not match IDEA_VERSION.txt ${RELEASE_VERSION}."
            exit 1
          fi
      - name: Install workflow linter
        env:
          GOBIN: ${{ runner.temp }}/ci-tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci --strict-allow-scripts
      - name: Build without changing tracked files
        run: |
          npm run build
          git diff --exit-code -- .
      - name: Run checks
        # tools/parity/live, tools/parity/fixtures and docs/port hold real cluster data and are
        # untracked in this public repository. Declaring the checkout public makes the tests that
        # need them skip (the skip-policy check lists each one) instead of failing at setup.
        env:
          IDEACTL_PUBLIC_CHECKOUT: '1'
        run: node scripts/ci-checks.mjs all
      - name: Build the runner release executable
        if: steps.inputs.outputs.release == 'true'
        run: npm run build:dist -- --target linux-amd64
      - name: Smoke-test the extracted release executable
        if: steps.inputs.outputs.release == 'true'
        run: |
          set -euo pipefail
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          tar -xzf dist/release/ideactl-v*-linux-amd64.tar.gz -C "$SMOKE_ROOT"
          node test/support/release-smoke.ts "$SMOKE_ROOT/ideactl"
      - name: Smoke-test the Linux executable image
        if: steps.inputs.outputs.release == 'true'
        run: |
          set -euo pipefail
          IMAGE=ideactl-linux-smoke
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          mkdir -p "$SMOKE_ROOT/config"
          cp test/cli/shell-path-values.yml "$SMOKE_ROOT/values.yml"
          docker build --tag "$IMAGE" --file scripts/ideactl-linux.Dockerfile dist/release/linux-amd64
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env PATH=/tmp/empty --workdir /tmp/work "$IMAGE" about
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --env PATH=/tmp/empty --workdir /tmp/work \
            --volume "$SMOKE_ROOT/values.yml:/tmp/values.yml:ro" \
            --volume "$SMOKE_ROOT/config:/tmp/config" "$IMAGE" \
            config generate --values-file /tmp/values.yml --config-dir /tmp/config --force
          test -s "$SMOKE_ROOT/config/config/idea.yml"
  private-parity:
    # Only reviewed main code may read private captures. Never run this on PR code.
    if: >-
      github.repository == 'cfs-energy/idea' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.IDEACTL_PRIVATE_PARITY == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: source/idea/ideactl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.8.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and build before fetching private data
        run: |
          npm ci --strict-allow-scripts
          npm run build
          python3 -m pip install 'jinja2==3.1.6' 'PyYAML==6.0.3'
          mkdir -p ~/.idea/lib/dynamodb-local
          curl -fsSL https://d1ni2b6xgvw0s0.cloudfront.net/v2.x/dynamodb_local_latest.tar.gz | tar -xz -C ~/.idea/lib/dynamodb-local
      - name: Authenticate for the single private capture object
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          aws-region: us-east-2
          role-to-assume: ${{ vars.IDEACTL_PARITY_ROLE_ARN }}
          role-duration-seconds: 900
          allowed-account-ids: ${{ vars.IDEACTL_PARITY_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Fetch and run private parity without publishing capture data
        env:
          IDEACTL_PARITY_SHA256: ${{ vars.IDEACTL_PARITY_SHA256 }}
          IDEACTL_PARITY_BUCKET: ${{ vars.IDEACTL_PARITY_BUCKET }}
        run: bash scripts/private-parity.sh
      - name: Remove private captures and logs
        if: always()
        run: |
          rm -rf tools/parity/live tools/parity/fixtures docs/port
          rm -rf "$RUNNER_TEMP/ideactl-private-parity"
