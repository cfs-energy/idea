name: renovate locks
# Renovate's hosted app cannot regenerate this repository's lock files in its sandbox: npm refuses
# the tarball fetch that aws-cdk-lib's bundled dependencies need, and its pip-compile writes
# --no-index into the lock header, which the lock check rejects. This workflow regenerates the locks
# on every Renovate branch of this repository and pushes them back as the repository's app, which
# re-runs the checks. Without the app secrets it reports the drift and stops, and the pull request
# stays red.
#
# The dependency tooling runs in a job with a read-only token and no secrets. Only the lock files
# leave it, as an artifact; the job that holds the app credential runs no dependency code and
# commits nothing but those paths.
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  # The number is unique to this pull request; a branch name is not, across forks.
  group: renovate-locks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.7
          install_args: node python uv pypi:pip-tools npm:yarn
      - name: Regenerate the npm and yarn locks
        run: |
          (cd source/idea/ideactl && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          (cd source/idea/idea-cluster-manager/webapp && yarn install --ignore-scripts --non-interactive --ignore-engines)
      - name: Regenerate the Python locks
        run: |
          mise run req:update
      - name: Collect the changed locks
        id: diff
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/locks"
          git diff --stat -- source/idea/ideactl/package-lock.json source/idea/idea-cluster-manager/webapp/yarn.lock requirements
          changed=false
          for path in source/idea/ideactl/package-lock.json source/idea/idea-cluster-manager/webapp/yarn.lock requirements/*.txt; do
            if ! git diff --quiet -- "$path"; then
              mkdir -p "$RUNNER_TEMP/locks/$(dirname "$path")"
              cp "$path" "$RUNNER_TEMP/locks/$path"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Upload the changed locks
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: renovate-locks
          path: ${{ runner.temp }}/locks
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Sign in as the repository's app
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RENOVATE_LOCKS_APP_ID }}
          private-key: ${{ secrets.RENOVATE_LOCKS_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Refuse without the app
        if: steps.app.outputs.token == ''
        run: |
          echo "::error::the locks differ and no app token is configured; regenerate them locally"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download the regenerated locks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: renovate-locks
          path: ${{ runner.temp }}/locks
      - name: Accept only the lock files
        working-directory: ${{ runner.temp }}/locks
        run: bash "$GITHUB_WORKSPACE/.github/renovate-locks-accept.sh" "$GITHUB_WORKSPACE"
      - name: Push the locks back to the branch
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- source/idea/ideactl/package-lock.json source/idea/idea-cluster-manager/webapp/yarn.lock requirements
          if git diff --cached --quiet; then echo "locks already current"; exit 0; fi
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^M  ' || true)"
          git diff --cached --stat
          git -c user.name=idea-locks -c user.email=idea-locks@example.invalid commit -q -m "chore(deps): regenerate lock files"
          AUTH=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          # A fast-forward of the commit the locks were built from; a newer push rejects it.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$HEAD_REF"
