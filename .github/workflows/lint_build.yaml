name: Build Tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
jobs:
  lint_and_build:
    runs-on: ubuntu-large
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect image inputs
        id: inputs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-inputs.sh
      - name: Check version consistency
        run: |
          SH_REV=$(grep -m1 '^IDEA_REVISION=' idea-admin.sh | sed -E 's/.*:-"([^"]+)"\}.*/\1/')
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          EXPECTED="v${VERSION}"
          echo "idea-admin.sh revision:          ${SH_REV}"
          echo "IDEA_VERSION.txt:                ${VERSION} (expected revision ${EXPECTED})"
          if [ "${SH_REV}" != "${EXPECTED}" ]; then
            echo "::error::Version mismatch: IDEA_VERSION.txt=${VERSION} (expected revision ${EXPECTED}), idea-admin.sh default=${SH_REV}"
            exit 1
          fi
          echo "Version consistency check passed (${EXPECTED})"
      - name: Pre-commit Linting
        uses: ./.github/actions/pre-commit
      - name: Setup Development Environment
        uses: ./.github/actions/setup_dev_environment
      - name: Build Modules
        uses: ./.github/actions/build_modules
      - name: Verify Python locks by recompiling
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/requirements-locks.py --check
      - name: Exercise runtime installer
        if: steps.inputs.outputs.runtimes == 'true'
        run: bash scripts/ci-runtime.sh
      - name: Stage image packages
        if: steps.inputs.outputs.images == 'true'
        run: bash scripts/ci-stage-images.sh
      - name: Set up image builder
        if: steps.inputs.outputs.images == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build deployment image without publishing
        if: steps.inputs.outputs.images == 'true'
        uses: docker/bake-action@v7
        with:
          # The staged packages are untracked, so the checkout is the context, not the Git remote.
          source: .
          files: .github/ci-images.hcl
          allow: fs.read=/tmp/dcv-packages
          load: true
          push: false
      - name: Smoke-test deployment image
        if: steps.inputs.outputs.images == 'true'
        run: bash scripts/ci-smoke-images.sh
