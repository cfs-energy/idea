name: Build Tests
on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint_and_build:
    runs-on: ubuntu-large
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect changed inputs
        id: inputs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-inputs.sh
      - name: Check version consistency
        if: steps.inputs.outputs.version == 'true'
        run: |
          SH_REV=$(grep -m1 '^IDEA_REVISION=' idea-admin.sh | sed -E 's/.*:-"([^"]+)"\}.*/\1/')
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          EXPECTED="v${VERSION}"
          echo "idea-admin.sh revision:          ${SH_REV}"
          echo "IDEA_VERSION.txt:                ${VERSION} (expected revision ${EXPECTED})"
          if [ "${SH_REV}" != "${EXPECTED}" ]; then
            echo "::error::Version mismatch: IDEA_VERSION.txt=${VERSION} (expected revision ${EXPECTED}), idea-admin.sh default=${SH_REV}"
            exit 1
          fi
          echo "Version consistency check passed (${EXPECTED})"
      - name: Set up pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.7
      - name: Scan checkout for secrets
        run: bash scripts/trufflehog-scan.sh
      - name: Lint
        run: hk check --all
        env:
          # CI also runs on main; the branch guard is for local commits.
          HK_SKIP_STEPS: no-commit-to-branch
      - name: Setup Development Environment
        uses: ./.github/actions/setup_dev_environment
      - name: Build Modules
        uses: ./.github/actions/build_modules
      - name: Verify Python locks by recompiling
        run: |
          node --test scripts/tooling/*.test.mjs
          # Resolve the pinned identify executable, not mise-action's PATH shim.
          mise exec pypi:identify -- "$VIRTUAL_ENV/bin/python" -m unittest discover -s scripts -p 'test_*.py'
          mise run req:update --check
      - name: Exercise runtime installer
        if: steps.inputs.outputs.runtimes == 'true'
        run: bash scripts/ci-runtime.sh
