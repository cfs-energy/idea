name: Build and Push
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      ecr_repository:
        description: 'Public ECR registry to publish to, as public.ecr.aws/<alias>'
        required: true
        default: 'public.ecr.aws/s5o2b4m0'
        type: string
      control_plane_image_name:
        description: 'Repository name for the control-plane image. Leave empty for the released image. A non-main dispatch must set this input or release_candidate.'
        required: false
        default: ''
        type: string
      release_candidate:
        description: 'Publish this build as release candidate N (v<version>-rc.N prerelease and <version>-rc.N image). A merge to main then releases exactly this build.'
        required: false
        default: ''
        type: string
concurrency:
  group: release-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ideactl_checks.yaml
    # the called private-parity job requests OIDC; a caller must grant at least what it asks
    permissions:
      contents: read
      id-token: write
  tests:
    uses: ./.github/workflows/unit_tests.yaml
  release_available:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuse an existing release or candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE: ${{ github.event.inputs.release_candidate }}
        run: |
          if [ -n "$RELEASE_CANDIDATE" ]; then
            if [ "$GITHUB_RUN_ATTEMPT" != 1 ] && ! bash source/idea/ideactl/scripts/assert-new-candidate.sh "$RELEASE_CANDIDATE"; then
              echo "::error::Attempt ${GITHUB_RUN_ATTEMPT} of this run stopped: an earlier attempt published candidate ${RELEASE_CANDIDATE}, or the check above failed. A re-run cannot change a published candidate, and promotion reads the attempt that published it, so this failed attempt does not affect it. For a new build, dispatch release_candidate=$((RELEASE_CANDIDATE + 1))."
              exit 1
            fi
            bash source/idea/ideactl/scripts/assert-new-candidate.sh "$RELEASE_CANDIDATE"
          else
            bash source/idea/ideactl/scripts/assert-new-release.sh
          fi
  build_ideactl_artifacts:
    name: Build ideactl ${{ matrix.target }}
    # A merge to main releases its candidate's artifacts; only a dispatch builds.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: source/idea/ideactl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.7
          install_args: node python
      - name: Check package version
        run: |
          PACKAGE_VERSION=$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')
          RELEASE_VERSION=$(tr -d '[:space:]' < ../../../IDEA_VERSION.txt)
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::ideactl package version ${PACKAGE_VERSION} does not match IDEA_VERSION.txt ${RELEASE_VERSION}."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build the macOS release file
        run: npm run build:dist -- --target ${{ matrix.target }}
      - name: Test the extracted macOS release file offline
        run: |
          set -euo pipefail
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          tar -xzf dist/release/ideactl-v*-${{ matrix.target }}.tar.gz -C "$SMOKE_ROOT"
          node test/support/release-smoke.ts "$SMOKE_ROOT/ideactl"
      - name: Upload the macOS release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ideactl-${{ matrix.target }}
          path: |
            source/idea/ideactl/dist/release/${{ matrix.target }}/ideactl
            source/idea/ideactl/dist/release/ideactl-v*-${{ matrix.target }}.tar.gz
            source/idea/ideactl/dist/release/ideactl-v*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
  build_ideactl_linux_artifact:
    name: Build ideactl ${{ matrix.target }}
    # A merge to main releases its candidate's artifacts; only a dispatch builds.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: source/idea/ideactl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.7
          install_args: node python
      - name: Check package version
        run: |
          PACKAGE_VERSION=$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')
          RELEASE_VERSION=$(tr -d '[:space:]' < ../../../IDEA_VERSION.txt)
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::ideactl package version ${PACKAGE_VERSION} does not match IDEA_VERSION.txt ${RELEASE_VERSION}."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build the Linux release file
        run: npm run build:dist -- --target ${{ matrix.target }}
      - name: Test the extracted Linux release file offline
        run: |
          set -euo pipefail
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          tar -xzf dist/release/ideactl-v*-${{ matrix.target }}.tar.gz -C "$SMOKE_ROOT"
          node test/support/release-smoke.ts "$SMOKE_ROOT/ideactl"
      - name: Test the Linux release file in a container image
        run: |
          set -euo pipefail
          IMAGE=ideactl-linux-smoke
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          mkdir -p "$SMOKE_ROOT/config"
          cp test/cli/shell-path-values.yml "$SMOKE_ROOT/values.yml"
          docker build \
            --tag "$IMAGE" \
            --file scripts/ideactl-linux.Dockerfile \
            dist/release/${{ matrix.target }}
          # The runner's own user, so the generated files can be removed afterwards.
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env PATH=/tmp/empty \
            --workdir /tmp/work \
            "$IMAGE" \
            about
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env PATH=/tmp/empty \
            --workdir /tmp/work \
            --volume "$SMOKE_ROOT/values.yml:/tmp/values.yml:ro" \
            --volume "$SMOKE_ROOT/config:/tmp/config" \
            "$IMAGE" \
            config generate \
              --values-file /tmp/values.yml \
              --config-dir /tmp/config \
              --force
          test -s "$SMOKE_ROOT/config/config/idea.yml"
      - name: Upload the Linux release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ideactl-${{ matrix.target }}
          path: |
            source/idea/ideactl/dist/release/${{ matrix.target }}/ideactl
            source/idea/ideactl/dist/release/ideactl-v*-${{ matrix.target }}.tar.gz
            source/idea/ideactl/dist/release/ideactl-v*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
  build_ideactl_windows_artifact:
    name: Build ideactl Windows x64
    # A merge to main releases its candidate's artifacts; only a dispatch builds.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    defaults:
      run:
        working-directory: source/idea/ideactl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.7
          install_args: node
      - name: Check package version
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $releaseVersion = (Get-Content ../../../IDEA_VERSION.txt -Raw).Trim()
          if ($packageVersion -ne $releaseVersion) { throw "Package and release versions differ" }
      - name: Install dependencies
        run: npm ci
      - name: Build the Windows release file
        run: npm run build:dist -- --target windows-amd64
      - name: Test the extracted Windows release file offline
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'ideactl smoke'
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          try {
            $archive = Get-Item dist/release/ideactl-v*-windows-amd64.zip
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $smokeRoot
            node test/support/release-smoke.ts (Join-Path $smokeRoot 'ideactl.exe')
            if ($LASTEXITCODE -ne 0) { throw "Release smoke failed" }
          } finally {
            Remove-Item -Recurse -Force $smokeRoot
          }
      - name: Upload the Windows release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ideactl-windows-amd64
          path: |
            source/idea/ideactl/dist/release/windows-amd64/ideactl.exe
            source/idea/ideactl/dist/release/ideactl-v*-windows-amd64.zip
            source/idea/ideactl/dist/release/ideactl-v*-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 7
  build_image:
    if: github.event_name == 'workflow_dispatch'
    needs: [release_available, checks, tests, build_ideactl_artifacts, build_ideactl_linux_artifact, build_ideactl_windows_artifact]
    # Build-time dependency code runs in this job, so it holds no cloud credential and cannot
    # request an OIDC token. It hands the tested image on as an archive with its digests.
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      archive_sha256: ${{ steps.image.outputs.archive_sha256 }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Validate the image name
        env:
          CONTROL_PLANE_IMAGE_NAME: ${{ github.event.inputs.control_plane_image_name }}
          RELEASE_CANDIDATE: ${{ github.event.inputs.release_candidate }}
        run: |
          # Released tags come only from promoting a candidate on merge, never from a dispatch.
          if [ -z "$CONTROL_PLANE_IMAGE_NAME" ] && [ -z "$RELEASE_CANDIDATE" ]; then
            echo "::error::A dispatch must set release_candidate, or control_plane_image_name for a private build. Released tags come only from merging a proven candidate."
            exit 1
          fi
          if [ -n "$RELEASE_CANDIDATE" ] && [ -n "$CONTROL_PLANE_IMAGE_NAME" ]; then
            echo "::error::A release candidate is published to the released image repository; leave control_plane_image_name empty."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate the candidate registry
        env:
          ECR_REGISTRY: ${{ github.event.inputs.ecr_repository }}
          RELEASE_CANDIDATE: ${{ github.event.inputs.release_candidate }}
        run: |
          # Promotion and idea-admin.sh accept only the official repository; refuse before the build.
          OFFICIAL=$(sed -nE 's|^IDEA_DOCKER_REPO_DEFAULT="([^/]+/[^/]+)/.*"$|\1|p' idea-admin.sh)
          if [ -n "$RELEASE_CANDIDATE" ] && [ -n "$ECR_REGISTRY" ] && [ "$ECR_REGISTRY" != "$OFFICIAL" ]; then
            echo "::error::A release candidate is published to ${OFFICIAL}, the registry idea-admin.sh and promotion accept; leave ecr_repository at its default, not ${ECR_REGISTRY}."
            exit 1
          fi
      - name: Check version consistency
        run: |
          SH_REV=$(grep -m1 '^IDEA_REVISION=' idea-admin.sh | sed -E 's/.*:-"([^"]+)"\}.*/\1/')
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          EXPECTED="v${VERSION}"
          echo "idea-admin.sh revision:          ${SH_REV}"
          echo "IDEA_VERSION.txt:                ${VERSION} (expected revision ${EXPECTED})"
          if [ "${SH_REV}" != "${EXPECTED}" ]; then
            echo "::error::Version mismatch: IDEA_VERSION.txt=${VERSION} (expected revision ${EXPECTED}), idea-admin.sh default=${SH_REV}"
            exit 1
          fi
          echo "Version consistency check passed (${EXPECTED})"
      - name: Setup Development Environment
        uses: ./.github/actions/setup_dev_environment
      - name: Build Modules
        uses: ./.github/actions/build_modules
      - name: Check the release is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash source/idea/ideactl/scripts/assert-new-release.sh
      - name: Build, test and scan the image
        id: image
        uses: ./.github/actions/build_control_plane_image
        with:
          cache-write: 'true'
      - name: Upload the image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: control-plane-image
          path: ${{ runner.temp }}/control-plane-image/control-plane.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish_image:
    if: github.event_name == 'workflow_dispatch'
    needs: [build_image]
    # The only dispatch job that can assume ECR_ROLE. It runs no build or dependency code: it
    # checks the archive against the build's digests, pushes it unchanged and tags it.
    environment: release
    outputs:
      image: ${{ steps.push.outputs.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: control-plane-image
          path: ${{ runner.temp }}/control-plane-image
      - name: Verify the image archive
        env:
          ARCHIVE_SHA256: ${{ needs.build_image.outputs.archive_sha256 }}
          DIGEST: ${{ needs.build_image.outputs.digest }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/control-plane-image/control-plane.tar"
          if ! [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ && "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build recorded no usable digests."
            exit 1
          fi
          echo "${ARCHIVE_SHA256}  ${ARCHIVE}" | sha256sum --check -
          test "$(tar -xOf "$ARCHIVE" index.json | jq -er '.manifests | if length == 1 then .[0].digest else error("the archive must hold exactly one image manifest") end')" = "$DIGEST"
      - name: Configure AWS Credentials for ECR Push
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ECR_ROLE }}
      - name: Use the registry credential helper
        # Tokens are fetched per pull and push from the job's role; nothing is written to the Docker config.
        run: |
          set -euo pipefail
          sudo apt-get install -y -q amazon-ecr-credential-helper
          command -v skopeo > /dev/null || sudo apt-get install -y -q skopeo
          mkdir -p ~/.docker
          printf '{"credHelpers":{"public.ecr.aws":"ecr-login"}}\n' > ~/.docker/config.json
      - name: Push the tested image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ECR_REGISTRY: ${{ github.event.inputs.ecr_repository }}
          CONTROL_PLANE_IMAGE_NAME: ${{ github.event.inputs.control_plane_image_name || 'idea-control-plane' }}
          RELEASE_CANDIDATE: ${{ github.event.inputs.release_candidate }}
          DIGEST: ${{ needs.build_image.outputs.digest }}
        run: |
          set -euo pipefail
          bash source/idea/ideactl/scripts/assert-new-release.sh
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          TEMP_TAG="build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ECR_REGISTRY="${ECR_REGISTRY:-$(sed -nE 's|^IDEA_DOCKER_REPO_DEFAULT="([^/]+/[^/]+)/.*"$|\1|p' idea-admin.sh)}"
          if [ -z "${ECR_REGISTRY}" ]; then
            echo "::error::Could not determine the public registry from idea-admin.sh."
            exit 1
          fi
          REPOSITORY="${ECR_REGISTRY}/${CONTROL_PLANE_IMAGE_NAME}"
          # The archive's own manifest bytes, so the registry digest is the one the build recorded.
          skopeo copy --preserve-digests "oci-archive:${RUNNER_TEMP}/control-plane-image/control-plane.tar" "docker://${REPOSITORY}:${TEMP_TAG}"
          # The digest is the hash of the manifest bytes the registry serves for a reference.
          digest() { local sum; sum=$(docker buildx imagetools inspect "$1" --raw | sha256sum) || return 1; echo "sha256:${sum%% *}"; }
          test "$(digest "${REPOSITORY}:${TEMP_TAG}")" = "$DIGEST"
          IMAGE="${REPOSITORY}@${DIGEST}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_CANDIDATE" ]; then
            # A candidate never takes a release tag; the merge to main re-tags this digest.
            bash source/idea/ideactl/scripts/assert-new-candidate.sh "$RELEASE_CANDIDATE"
            RC_TAG="${REPOSITORY}:${VERSION}-rc.${RELEASE_CANDIDATE}"
            # A tag an earlier attempt left is kept only if it already names this image; it is
            # never moved to another one. Only a definite "not found" leaves the tag free to
            # write: any other failed read stops here.
            READ_ERROR=$(mktemp)
            if EXISTING=$(digest "$RC_TAG" 2>"$READ_ERROR"); then
              if [ "$EXISTING" != "$DIGEST" ]; then
                echo "::error::${RC_TAG} already names ${EXISTING}, not this build's ${DIGEST}. Use the next candidate number."
                exit 1
              fi
            # the registry's answer for a missing tag, not, say, a credential helper not found
            elif ! grep -qiE ': not found$|manifest unknown' "$READ_ERROR"; then
              cat "$READ_ERROR" >&2
              echo "::error::Could not read ${RC_TAG} to check that it is absent; it is not written. Re-run when the registry answers."
              exit 1
            fi
            # A copy of the exact manifest, as above: a tag written any other way can name a new
            # index around it, whose digest is not the one recorded.
            skopeo copy --preserve-digests "docker://${IMAGE}" "docker://${RC_TAG}"
            for TRY in 1 2 3 4 5 6; do
              test "$(digest "$RC_TAG")" = "$DIGEST" && exit 0
              echo "::warning::${RC_TAG} does not read back as ${DIGEST} yet (try ${TRY}/6)"
              test "$TRY" -lt 6 && sleep 10
            done
            echo "::error::${RC_TAG} never read back as ${DIGEST}."
            exit 1
          fi
          echo "::notice::Private build ${IMAGE}; no release tags are written by a dispatch."
  publish_release_candidate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_candidate != ''
    needs:
      - build_ideactl_artifacts
      - build_ideactl_linux_artifact
      - build_ideactl_windows_artifact
      - publish_image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ideactl-*
          path: release
          merge-multiple: true
      - name: Verify and combine checksums
        working-directory: release
        run: |
          set -euo pipefail
          cat ./*.tar.gz.sha256 ./*.zip.sha256 | LC_ALL=C sort > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Record the candidate
        env:
          RELEASE_CANDIDATE: ${{ github.event.inputs.release_candidate }}
          IMAGE: ${{ needs.publish_image.outputs.image }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          case "$IMAGE" in *@sha256:*) ;; *) echo "::error::The candidate image is not digest-qualified: '${IMAGE}'."; exit 1;; esac
          # run_id and run_attempt name the attempt whose release-record artifact promotion
          # verifies against; a later attempt of the same run cannot replace it.
          jq -n --arg version "$VERSION" --arg candidate "$RELEASE_CANDIDATE" \
            --arg tree "$(git rev-parse 'HEAD^{tree}')" --arg commit "$GITHUB_SHA" --arg image "$IMAGE" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{version: $version, candidate: ($candidate | tonumber), tree: $tree, commit: $commit, image: $image, run_id: ($run | tonumber), run_attempt: ($attempt | tonumber)}' \
            > release/candidate.json
          # The released idea-admin.sh carries this image's digest, so it runs without a lookup.
          DIGEST="${IMAGE#*@}"
          sed 's|^IDEA_IMAGE_DIGEST_DEFAULT=""$|IDEA_IMAGE_DIGEST_DEFAULT="'"${DIGEST}"'"|' idea-admin.sh > release/idea-admin.sh
          test "$(grep -c '^IDEA_IMAGE_DIGEST_DEFAULT=' release/idea-admin.sh)" = 1
          grep -qx "IDEA_IMAGE_DIGEST_DEFAULT=\"${DIGEST}\"" release/idea-admin.sh
          (cd release && sha256sum candidate.json idea-admin.sh >> SHA256SUMS)
          mkdir -p release-record
          cp release/candidate.json release/SHA256SUMS release/idea-admin.sh release-record/
      - name: Keep the record with this run
        # A run's artifacts cannot be replaced, unlike release assets; promotion checks the
        # release against this copy. Promote within the retention period or cut a new candidate.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-record-attempt-${{ github.run_attempt }}
          path: release-record
          if-no-files-found: error
          retention-days: 90
      - name: Publish the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CANDIDATE: ${{ github.event.inputs.release_candidate }}
          IMAGE: ${{ needs.publish_image.outputs.image }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          TAG="v${VERSION}-rc.${RELEASE_CANDIDATE}"
          bash source/idea/ideactl/scripts/assert-new-candidate.sh "$RELEASE_CANDIDATE"
          gh release create "$TAG" \
            release/*.tar.gz \
            release/*.tar.gz.sha256 \
            release/*.zip \
            release/*.zip.sha256 \
            release/SHA256SUMS \
            release/candidate.json \
            release/idea-admin.sh \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "IDEA ${VERSION} release candidate ${RELEASE_CANDIDATE}" \
            --notes "Release candidate. Image: ${IMAGE%@*}:${VERSION}-rc.${RELEASE_CANDIDATE} (${IMAGE#*@}). Merging this exact source to main releases these files and this image digest unchanged."
          # Read the published record back: the release must hold what this attempt recorded.
          mkdir published
          for FILE in candidate.json SHA256SUMS idea-admin.sh; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE" --dir published
            cmp "published/${FILE}" "release-record/${FILE}"
          done
  promote_release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    # The merged tree is verified identical to a candidate whose run passed checks and tests.
    # Promotion builds nothing, so only release availability must be checked again.
    needs: [release_available]
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      # reads the candidate run and its release-record artifact
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Find the candidate built from this source
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(bash source/idea/ideactl/scripts/find-release-candidate.sh)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing ${TAG} unchanged."
      - name: Download and verify the candidate's files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          # The release's files are writable after the candidate run; that run's record is not.
          # The record must come from a successful dispatch of this workflow on this exact tree.
          RUN_ID=$(jq -er '.run_id | select(type == "number" and . > 0) | tostring' candidate.json)
          # The attempt that published: a later, refused re-run of the run does not count.
          ATTEMPT=$(jq -er '.run_attempt | select(type == "number" and . > 0) | tostring' candidate.json)
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/attempts/${ATTEMPT}" \
            --jq '[.path, .event, .conclusion, .head_repository.full_name, .head_sha] | @tsv')
          IFS=$'\t' read -r RUN_PATH RUN_EVENT RUN_CONCLUSION RUN_REPOSITORY RUN_SHA <<< "$RUN"
          test "$RUN_PATH" = .github/workflows/build_push.yaml
          test "$RUN_EVENT" = workflow_dispatch
          test "$RUN_CONCLUSION" = success
          test "$RUN_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${RUN_SHA}" --jq '.tree.sha')" = "$(git rev-parse 'HEAD^{tree}')"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-record-attempt-${ATTEMPT}" --dir ../release-record
          for FILE in candidate.json SHA256SUMS idea-admin.sh; do cmp "../release-record/${FILE}" "$FILE"; done
          # Require the manifest and the wrapper in the checksum list.
          for FILE in candidate.json idea-admin.sh; do
            grep -E "^[0-9a-f]{64}  ${FILE//./\\.}\$" SHA256SUMS | sha256sum --check -
          done
          sha256sum --check SHA256SUMS
          # Exactly the recorded files are released: every target, nothing added to the
          # prerelease since, and each sidecar written again from the record.
          VERSION=$(tr -d '[:space:]' < ../IDEA_VERSION.txt)
          LISTED=$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)
          EXPECTED=$(printf '%s\n' candidate.json idea-admin.sh \
            "ideactl-v${VERSION}-darwin-arm64.tar.gz" "ideactl-v${VERSION}-linux-amd64.tar.gz" \
            "ideactl-v${VERSION}-linux-arm64.tar.gz" "ideactl-v${VERSION}-windows-amd64.zip" | LC_ALL=C sort)
          if [ "$LISTED" != "$EXPECTED" ]; then
            echo "::error::The candidate's SHA256SUMS lists ${LISTED//$'\n'/ }, not ${EXPECTED//$'\n'/ }."
            exit 1
          fi
          mkdir ../release-publish
          cp SHA256SUMS ../release-publish/
          for FILE in $LISTED; do
            cp "$FILE" ../release-publish/
            case "$FILE" in ideactl-*) grep -E "^[0-9a-f]{64}  ${FILE//./\\.}\$" SHA256SUMS > "../release-publish/${FILE}.sha256" ;; esac
          done
          test "$(jq -er '.tree' candidate.json)" = "$(git rev-parse 'HEAD^{tree}')"
          # The wrapper is this tree's idea-admin.sh with only the candidate image's digest filled in.
          DIGEST=$(jq -er '.image | split("@")[1]' candidate.json)
          diff <(sed "s|^IDEA_IMAGE_DIGEST_DEFAULT=\"${DIGEST}\"\$|IDEA_IMAGE_DIGEST_DEFAULT=\"\"|" idea-admin.sh) ../idea-admin.sh
      - name: Configure AWS Credentials for ECR Push
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ECR_ROLE }}
      - name: Use the registry credential helper
        run: |
          set -euo pipefail
          sudo apt-get install -y -q amazon-ecr-credential-helper
          command -v skopeo > /dev/null || sudo apt-get install -y -q skopeo
          mkdir -p ~/.docker
          printf '{"credHelpers":{"public.ecr.aws":"ecr-login"}}\n' > ~/.docker/config.json
      - name: Tag the candidate image as the release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          bash source/idea/ideactl/scripts/assert-new-release.sh
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          IMAGE=$(jq -er '.image' release/candidate.json)
          case "$IMAGE" in *@sha256:*) ;; *) echo "::error::Candidate image is not digest-qualified: '${IMAGE}'."; exit 1;; esac
          REGISTRY=$(sed -nE 's|^IDEA_DOCKER_REPO_DEFAULT="([^/]+/[^/]+)/.*"$|\1|p' idea-admin.sh)
          test -n "$REGISTRY"
          REPOSITORY="${REGISTRY}/idea-control-plane"
          test "${IMAGE%@*}" = "$REPOSITORY"
          docker buildx imagetools inspect "$IMAGE" >/dev/null
          # the digest is the hash of the manifest bytes the registry serves for a reference
          digest() { local sum; sum=$(docker buildx imagetools inspect "$1" --raw | sha256sum) || return 1; echo "sha256:${sum%% *}"; }
          test "$(digest "${REPOSITORY}:${CANDIDATE_TAG#v}")" = "${IMAGE#*@}"
          # Copies of the exact manifest, as the candidate tag was written, so each tag names the
          # recorded digest and not a new index around it.
          for TAG in "v${VERSION}" "${VERSION}" latest; do
            skopeo copy --preserve-digests "docker://${IMAGE}" "docker://${REPOSITORY}:${TAG}"
          done
          # public ECR can serve a stale manifest for a few seconds after the tags move
          for TAG in "v${VERSION}" "${VERSION}" latest; do
            for TRY in 1 2 3 4 5 6; do
              test "$(digest "${REPOSITORY}:${TAG}")" = "${IMAGE#*@}" && continue 2
              echo "::warning::${TAG} does not read back as ${IMAGE#*@} yet (try ${TRY}/6)"
              test "$TRY" -lt 6 && sleep 10
            done
            echo "::error::${REPOSITORY}:${TAG} never read back as ${IMAGE#*@}."
            exit 1
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          DIGEST=$(jq -er '.image | split("@")[1]' release/candidate.json)
          bash source/idea/ideactl/scripts/assert-new-release.sh
          gh release create "v${VERSION}" \
            release-publish/* \
            --target "$GITHUB_SHA" \
            --title "IDEA ${VERSION}" \
            --notes "Released unchanged from ${TAG}: the same ideactl files and control-plane image digest ${DIGEST}. Self-contained ideactl executables for macOS and Linux (arm64 and amd64), and Windows (amd64), with checksums. Windows ideactl.exe is unsigned: SmartScreen may warn. After verifying the checksum, choose More info > Run anyway, or use PowerShell Unblock-File .\\ideactl.exe and run .\\ideactl.exe about."
