name: Build and Push
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      ecr_repository:
        description: 'Public ECR registry to publish to, as public.ecr.aws/<alias>'
        required: true
        default: 'public.ecr.aws/s5o2b4m0'
        type: string
      control_plane_image_name:
        description: 'Repository name for the control-plane image. Leave empty for the released image. A non-main dispatch must set this input.'
        required: false
        default: ''
        type: string
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ideactl_checks.yaml
  tests:
    uses: ./.github/workflows/unit_tests.yaml
  release_available:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash source/idea/ideactl/scripts/assert-new-release.sh
  build_ideactl_artifacts:
    name: Build ideactl ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: source/idea/ideactl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up release runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: source/idea/ideactl/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Check package version
        run: |
          PACKAGE_VERSION=$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')
          RELEASE_VERSION=$(tr -d '[:space:]' < ../../../IDEA_VERSION.txt)
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::ideactl package version ${PACKAGE_VERSION} does not match IDEA_VERSION.txt ${RELEASE_VERSION}."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build the macOS release file
        run: npm run build:dist -- --target ${{ matrix.target }}
      - name: Test the extracted macOS release file offline
        run: |
          set -euo pipefail
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          tar -xzf dist/release/ideactl-v*-${{ matrix.target }}.tar.gz -C "$SMOKE_ROOT"
          node test/support/release-smoke.ts "$SMOKE_ROOT/ideactl"
      - name: Upload the macOS release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ideactl-${{ matrix.target }}
          path: |
            source/idea/ideactl/dist/release/${{ matrix.target }}/ideactl
            source/idea/ideactl/dist/release/ideactl-v*-${{ matrix.target }}.tar.gz
            source/idea/ideactl/dist/release/ideactl-v*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
  build_ideactl_linux_artifact:
    name: Build ideactl ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: source/idea/ideactl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up release runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: source/idea/ideactl/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Check package version
        run: |
          PACKAGE_VERSION=$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; process.stdout.write(packageJson.version)')
          RELEASE_VERSION=$(tr -d '[:space:]' < ../../../IDEA_VERSION.txt)
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::ideactl package version ${PACKAGE_VERSION} does not match IDEA_VERSION.txt ${RELEASE_VERSION}."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build the Linux release file
        run: npm run build:dist -- --target ${{ matrix.target }}
      - name: Test the extracted Linux release file offline
        run: |
          set -euo pipefail
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          tar -xzf dist/release/ideactl-v*-${{ matrix.target }}.tar.gz -C "$SMOKE_ROOT"
          node test/support/release-smoke.ts "$SMOKE_ROOT/ideactl"
      - name: Test the Linux release file in a container image
        run: |
          set -euo pipefail
          IMAGE=ideactl-linux-smoke
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          mkdir -p "$SMOKE_ROOT/config"
          cp test/cli/shell-path-values.yml "$SMOKE_ROOT/values.yml"
          docker build \
            --tag "$IMAGE" \
            --file scripts/ideactl-linux.Dockerfile \
            dist/release/${{ matrix.target }}
          # The runner's own user, so the generated files can be removed afterwards.
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env PATH=/tmp/empty \
            --workdir /tmp/work \
            "$IMAGE" \
            about
          docker run --rm \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --env PATH=/tmp/empty \
            --workdir /tmp/work \
            --volume "$SMOKE_ROOT/values.yml:/tmp/values.yml:ro" \
            --volume "$SMOKE_ROOT/config:/tmp/config" \
            "$IMAGE" \
            config generate \
              --values-file /tmp/values.yml \
              --config-dir /tmp/config \
              --force
          test -s "$SMOKE_ROOT/config/config/idea.yml"
      - name: Upload the Linux release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ideactl-${{ matrix.target }}
          path: |
            source/idea/ideactl/dist/release/${{ matrix.target }}/ideactl
            source/idea/ideactl/dist/release/ideactl-v*-${{ matrix.target }}.tar.gz
            source/idea/ideactl/dist/release/ideactl-v*-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
  build_ideactl_windows_artifact:
    name: Build ideactl Windows x64
    runs-on: windows-2025
    defaults:
      run:
        working-directory: source/idea/ideactl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up release runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26.8.2'
          cache: npm
          cache-dependency-path: source/idea/ideactl/package-lock.json
      - name: Check package version
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $releaseVersion = (Get-Content ../../../IDEA_VERSION.txt -Raw).Trim()
          if ($packageVersion -ne $releaseVersion) { throw "Package and release versions differ" }
      - name: Install dependencies
        run: npm ci
      - name: Build the Windows release file
        run: npm run build:dist -- --target windows-amd64
      - name: Test the extracted Windows release file offline
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'ideactl smoke'
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          try {
            $archive = Get-Item dist/release/ideactl-v*-windows-amd64.zip
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $smokeRoot
            node test/support/release-smoke.ts (Join-Path $smokeRoot 'ideactl.exe')
            if ($LASTEXITCODE -ne 0) { throw "Release smoke failed" }
          } finally {
            Remove-Item -Recurse -Force $smokeRoot
          }
      - name: Upload the Windows release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ideactl-windows-amd64
          path: |
            source/idea/ideactl/dist/release/windows-amd64/ideactl.exe
            source/idea/ideactl/dist/release/ideactl-v*-windows-amd64.zip
            source/idea/ideactl/dist/release/ideactl-v*-windows-amd64.zip.sha256
          if-no-files-found: error
          retention-days: 7
  build_push_ideactl:
    needs: [release_available, checks, tests, build_ideactl_artifacts, build_ideactl_linux_artifact, build_ideactl_windows_artifact]
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate the image name
        env:
          CONTROL_PLANE_IMAGE_NAME: ${{ github.event.inputs.control_plane_image_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "main" ] && [ -z "$CONTROL_PLANE_IMAGE_NAME" ]; then
            echo "::error::A dispatch from $GITHUB_REF_NAME must set control_plane_image_name, or it would overwrite released images from an unmerged ref."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check version consistency
        run: |
          SH_REV=$(grep -m1 '^IDEA_REVISION=' idea-admin.sh | sed -E 's/.*:-"([^"]+)"\}.*/\1/')
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          EXPECTED="v${VERSION}"
          echo "idea-admin.sh revision:          ${SH_REV}"
          echo "IDEA_VERSION.txt:                ${VERSION} (expected revision ${EXPECTED})"
          if [ "${SH_REV}" != "${EXPECTED}" ]; then
            echo "::error::Version mismatch: IDEA_VERSION.txt=${VERSION} (expected revision ${EXPECTED}), idea-admin.sh default=${SH_REV}"
            exit 1
          fi
          echo "Version consistency check passed (${EXPECTED})"
      - name: Setup Development Environment
        uses: ./.github/actions/setup_dev_environment
      - name: Build Modules
        uses: ./.github/actions/build_modules
      - name: Configure AWS Credentials for ECR Push
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: ${{ secrets.ECR_ROLE }}
      - name: Stage DCV packages
        run: |
          set -euo pipefail
          PACKAGE_DIR=/tmp/dcv-packages
          DOWNLOAD_HOST=https://d1uj6qtbmh3dt5.cloudfront.net
          mkdir -p "$PACKAGE_DIR"
          curl --fail --location --silent --show-error -o "$PACKAGE_DIR/NICE-GPG-KEY" "$DOWNLOAD_HOST/NICE-GPG-KEY"
          curl --fail --location --silent --show-error -o "$PACKAGE_DIR/nice-dcv-session-manager-broker-amzn2023.noarch.rpm" "$DOWNLOAD_HOST/nice-dcv-session-manager-broker-amzn2023.noarch.rpm"
          curl --fail --location --silent --show-error -o "$PACKAGE_DIR/nice-dcv-connection-gateway-amzn2023.x86_64.rpm" "$DOWNLOAD_HOST/nice-dcv-connection-gateway-amzn2023.x86_64.rpm"
          curl --fail --location --silent --show-error -o "$PACKAGE_DIR/nice-dcv-connection-gateway-amzn2023.aarch64.rpm" "$DOWNLOAD_HOST/nice-dcv-connection-gateway-amzn2023.aarch64.rpm"
          curl --fail --location --silent --show-error -o "$PACKAGE_DIR/nice-dcv-amzn2023-x86_64.tgz" "$DOWNLOAD_HOST/nice-dcv-amzn2023-x86_64.tgz"
          curl --fail --location --silent --show-error -o "$PACKAGE_DIR/nice-dcv-amzn2023-aarch64.tgz" "$DOWNLOAD_HOST/nice-dcv-amzn2023-aarch64.tgz"
          (
            cd "$PACKAGE_DIR"
            sha256sum \
              nice-dcv-session-manager-broker-amzn2023.noarch.rpm \
              nice-dcv-connection-gateway-amzn2023.x86_64.rpm \
              nice-dcv-connection-gateway-amzn2023.aarch64.rpm \
              nice-dcv-amzn2023-x86_64.tgz \
              nice-dcv-amzn2023-aarch64.tgz \
              > checksums.txt
          )
      - name: Use the registry credential helper
        # Tokens are fetched per pull and push from the job's role; nothing is written to the Docker config.
        run: |
          set -euo pipefail
          sudo apt-get install -y -q amazon-ecr-credential-helper
          mkdir -p ~/.docker
          printf '{"credHelpers":{"public.ecr.aws":"ecr-login"}}\n' > ~/.docker/config.json
      - name: Expose the build cache runtime
        # Shell buildx commands need the cache credentials provided to JavaScript actions.
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Build and test temporary image
        env:
          GH_TOKEN: ${{ github.token }}
          ECR_REGISTRY: ${{ github.event.inputs.ecr_repository }}
          CONTROL_PLANE_IMAGE_NAME: ${{ github.event.inputs.control_plane_image_name || 'idea-control-plane' }}
        run: |
          set -euo pipefail
          bash source/idea/ideactl/scripts/assert-new-release.sh
          test -s source/idea/ideactl/test/cli/shell-path-values.yml
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          TEMP_TAG="build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ECR_REGISTRY="${ECR_REGISTRY:-$(sed -nE 's|^IDEA_DOCKER_REPO_DEFAULT="([^/]+/[^/]+)/.*"$|\1|p' idea-admin.sh)}"
          if [ -z "${ECR_REGISTRY}" ]; then
            echo "::error::Could not determine the public registry from idea-admin.sh."
            exit 1
          fi
          cp "dist/all-${VERSION}.tar.gz" "deployment/ecr/idea-control-plane/all-${VERSION}.tar.gz"
          cp "dist/idea-dcv-connection-gateway-${VERSION}.tar.gz" "deployment/ecr/idea-control-plane/idea-dcv-connection-gateway-${VERSION}.tar.gz"
          docker buildx create --use --platform linux/arm64 --name idea-images-builder
          docker buildx inspect --bootstrap
          docker buildx build --push --platform linux/arm64 \
            --build-arg IDEA_VERSION="${VERSION}" \
            --build-context dcv-packages=/tmp/dcv-packages \
            --cache-from type=gha,version=2,scope=idea-control-plane \
            --cache-to type=gha,version=2,mode=max,scope=idea-control-plane \
            --metadata-file /tmp/control-plane-image.json \
            -t "${ECR_REGISTRY}/${CONTROL_PLANE_IMAGE_NAME}:${TEMP_TAG}" \
            -f deployment/ecr/idea-control-plane/Dockerfile .
          SMOKE_ROOT=$(mktemp -d)
          trap 'rm -rf "$SMOKE_ROOT"' EXIT
          mkdir -p "$SMOKE_ROOT/config"
          cp source/idea/ideactl/test/cli/shell-path-values.yml "$SMOKE_ROOT/values.yml"
          CONTROL_PLANE_DIGEST=$(jq -er '.["containerimage.digest"]' /tmp/control-plane-image.json)
          IMAGE="${ECR_REGISTRY}/${CONTROL_PLANE_IMAGE_NAME}@${CONTROL_PLANE_DIGEST}"
          # The pbs_server wrapper needs the /etc/pbs.conf the scheduler role writes at start;
          # the binary answers alone. The runner's own user keeps the generated files removable.
          docker run --rm --entrypoint /bin/bash "$IMAGE" -c '/opt/pbs/sbin/pbs_server.bin --version'
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp --workdir /tmp/work "$IMAGE" ideactl about
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --workdir /tmp/work \
            --volume "$SMOKE_ROOT/values.yml:/tmp/values.yml:ro" \
            --volume "$SMOKE_ROOT/config:/tmp/config" \
            "$IMAGE" \
            ideactl config generate \
              --values-file /tmp/values.yml \
              --config-dir /tmp/config \
              --force
          test -s "$SMOKE_ROOT/config/config/idea.yml"
          bash source/idea/ideactl/scripts/assert-new-release.sh
          REPOSITORY="${IMAGE%@*}"
          docker buildx imagetools create \
            --tag "${REPOSITORY}:v${VERSION}" \
            --tag "${REPOSITORY}:${VERSION}" \
            --tag "${REPOSITORY}:latest" "$IMAGE"
  publish_ideactl_artifacts:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - build_ideactl_artifacts
      - build_ideactl_linux_artifact
      - build_ideactl_windows_artifact
      - build_push_ideactl
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ideactl-*
          path: release
          merge-multiple: true
      - name: Verify and combine checksums
        working-directory: release
        run: |
          set -euo pipefail
          cat ./*.tar.gz.sha256 ./*.zip.sha256 | LC_ALL=C sort > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < IDEA_VERSION.txt)
          TAG="v${VERSION}"
          bash source/idea/ideactl/scripts/assert-new-release.sh
          gh release create "$TAG" \
            release/*.tar.gz \
            release/*.tar.gz.sha256 \
            release/*.zip \
            release/*.zip.sha256 \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "IDEA ${VERSION}" \
            --notes "Self-contained ideactl executables for macOS and Linux (arm64 and amd64), and Windows (amd64), with checksums. Windows ideactl.exe is unsigned: SmartScreen may warn. After verifying the checksum, choose More info > Run anyway, or use PowerShell Unblock-File .\\ideactl.exe and run .\\ideactl.exe about."
