name: renovate
# Renovate runs from here rather than from the hosted app: the app's sandbox cannot build this
# repository's lock files. npm refuses the tarball fetch that aws-cdk-lib's bundled dependencies
# need, and its pip-compile writes `--no-index` into the lock header, which the lock check and the
# next Renovate pass both reject. Run on a runner, both tools have the network and write the same
# locks `scripts/requirements-locks.py` and `npm install` do. Repository configuration stays in
# .github/renovate.json; this file only supplies the schedule and the identity.
on:
  schedule:
    # Monday 03:23 EDT / 02:23 EST, inside the window renovate.json allows
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      ignore_schedule:
        description: Run now, outside the Monday window in renovate.json
        type: boolean
        default: false
permissions: {}
concurrency:
  group: renovate
  cancel-in-progress: false
jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      - name: Sign in as the repository's app
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@v46
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_FORCE: ${{ inputs.ignore_schedule && '{"schedule":null}' || '{}' }}
          LOG_LEVEL: info
