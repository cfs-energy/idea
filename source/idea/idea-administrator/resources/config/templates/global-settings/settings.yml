      - libX11-devel
      - libXau
      - libXft
      - libXrender
      - libical
      - libpng
      - libtool-ltdl
      - libxcb
      - tcl
      - tk
      - rpm-build
      - libtool
      - hwloc-devel
      - libXt-devel
      - libedit-devel
      - libical-devel
      - ncurses-devel
      - perl
      - python3
      - python3-pip
      - python3-devel
      - tcl-devel
      - tk-devel
      - swig
      - expat-devel
      - openssl-devel
      - libXext
