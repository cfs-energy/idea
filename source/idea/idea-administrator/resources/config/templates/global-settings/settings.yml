    # used by cluster-manager to convert .pem files to .ppk files
    putty:
      - putty

  # Keep version/nvm_version aligned with software_versions.yml, which pins the
  # same toolchain for the installer container and CI.
  nodejs:
    version: "22.23.2"
    nvm_version: "0.40.7"
    npm_version: "10.9.8"
    url: "https://raw.githubusercontent.com/nvm-sh/nvm/"
  openmpi:
    version: "5.0.7"
    url: "https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.7.tar.gz"
    checksum: "51be23bb79f9f978696689bbbc6bc65b7b0df67f0f5b502b83513c8e098a7e53cfa73d14aaae5fffc407e79eb9422a85"
    checksum_method: sha384

  # url must pin the versioned directory, never /latest/: upstream redirects /latest/ to the current
  # release, so a pinned filename under /latest/ 404s as soon as a new PuTTY ships.
  putty:
    version: "0.85"
    url: "https://the.earth.li/~sgtatham/putty/0.85/putty-0.85.tar.gz"
    checksum: "be24753dae138a870299ce3b63267c337cd14811efef667d0e2a5efe34645eaf67e7a1d51349a2272250d42332291d1f"
    checksum_method: sha384

  # Keep aligned with software_versions.yml python_version.
  python:
    version: "3.13.15"
    url: "https://www.python.org/ftp/python/3.13.15/Python-3.13.15.tgz"
    checksum: "085f0529892b35064abbc73c53129e504cf5223a656674b8990dd3bd53017db945dbbcdb286c0a6da6c13eccc3dded66"
    checksum_method: sha384

  {% if metrics_provider and 'prometheus' in metrics_provider %}
  # Held on the Prometheus 2.53 LTS line; 3.x is a breaking major (removed flags,
  # changed remote-write defaults and UI) and is not part of this release.
  prometheus:
    installer:
      linux:
        x86_64: https://github.com/prometheus/prometheus/releases/download/v2.53.5/prometheus-2.53.5.linux-amd64.tar.gz
        aarch64: https://github.com/prometheus/prometheus/releases/download/v2.53.5/prometheus-2.53.5.linux-arm64.tar.gz
      windows:
        x86_64: https://github.com/prometheus/prometheus/releases/download/v2.53.5/prometheus-2.53.5.windows-amd64.zip
        aarch64: https://github.com/prometheus/prometheus/releases/download/v2.53.5/prometheus-2.53.5.windows-arm64.zip
    exporters:
      node_exporter:
        linux:
          x86_64: https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-amd64.tar.gz
          aarch64: https://github.com/prometheus/node_exporter/releases/download/v1.12.1/node_exporter-1.12.1.linux-arm64.tar.gz
  {% endif %}

  # git tag of https://github.com/aws/efs-utils built from source on RHEL, Rocky and Ubuntu hosts.
  efs_utils:
    version: v3.3.0

  {% if 'scheduler' in enabled_modules %}
  # version is documentation only (efa.jinja2 reads url/checksum); keep all three aligned.
  efa:
    version: "1.44.0"
    url: "https://efa-installer.amazonaws.com/aws-efa-installer-1.44.0.tar.gz"
    checksum: "6a7c41e815c8187bac7a0d9690bfa561bfecaa3e47fec0d9d53a0a383282edcf2e163c042d858cb5385c452cba89dc2d"
    checksum_method: sha384
  openpbs:
    version: "23.06.06"
    url: "https://github.com/openpbs/openpbs/archive/v23.06.06.tar.gz"
    checksum: "8a4d7f9c326fd1de5c103e700422bc4d49edc9d50f142c033e9e7de8d10d52f5c4f92e902e107b8e89d3e12c147ebef4"
    checksum_method: sha384
    repo_url: "https://github.com/openpbs/openpbs.git"
    commit: "cd7ab5edaf03dcac2f1cb9e2f42d75eb117d468a"
    # commit pins gcc 14 fixes required to build on EL10; the tagged v23.06.06 tarball above will not compile there.
    # openpbs ships regular commits but infrequent tags, hence tracking a commit rather than a release.
    type: development # set to release if you want to use tagged releases
    packages:
      - postgresql
      - postgresql-contrib
      - postgresql-devel
      - postgresql-libs
      - postgresql-server
      - postgresql17
      - postgresql17-contrib
      - postgresql17-devel
      - postgresql17-server
  {% endif %}

