server:
  enable_http: true
  hostname: 0.0.0.0
  port: 8443
  enable_tls: true
  tls_certificate_file: {{apps_mount_dir}}/{{cluster_name}}/certs/idea.crt
  tls_key_file: {{apps_mount_dir}}/{{cluster_name}}/certs/idea.key
  enable_unix_socket: true
  unix_socket_file: /run/idea.sock
  max_workers: 16
  enable_metrics: false
  graceful_shutdown_timeout: 10
  api_context_path: /{{ module_id }}
  # list of DCV USB filter strings to allow; empty (default) allows no additional devices. format: DCV USB admin/user guides.
  usb_remotization: []


controller:
  autoscaling:
    public: false
    instance_type: {{instance_type}}
    base_os: {{base_os}}
    instance_ami: {{instance_ami}}
    volume_size: {{volume_size}}
    volume_type: {{volume_type}}
    enabled_detailed_monitoring: false
    min_capacity: 1
    max_capacity: 3
    cooldown_minutes: 5
    new_instances_protected_from_scale_in: false
    elb_healthcheck:
      # Specifies the time in minutes Auto Scaling waits before checking the health status of an EC2 instance that has come into service.
      grace_time_minutes: 15
    cpu_utilization_scaling_policy:
      target_utilization_percent: 80
      estimated_instance_warmup_minutes: 15
    rolling_update_policy:
      max_batch_size: 1
      min_instances_in_service: 1
      pause_time_minutes: 15
    # instance metadata access method
    metadata_http_tokens: "required"  # supported values are "required" for IMDSv2 or "optional" for IMDSv1
  # if true (default), blocks new eVDI sessions on projects that have exceeded their budget.
  enforce_project_budgets: true  # True or False
  #
  request_handler_threads:
    min: 1
    max: 8
  endpoints:
    external:
      priority: 13
      path_patterns: [ '/{{ module_id }}/*' ]
    internal:
      priority: 13
      path_patterns: [ '/{{ module_id }}/*' ]

dcv_broker:
  autoscaling:
    public: false
    instance_type: {{instance_type}}
    base_os: {{base_os}}
    instance_ami: {{instance_ami}}
    volume_size: {{volume_size}}
    volume_type: {{volume_type}}
    enabled_detailed_monitoring: false
    min_capacity: 1
    max_capacity: 3
    cooldown_minutes: 5
    new_instances_protected_from_scale_in: false
    elb_healthcheck:
      # Specifies the time in minutes Auto Scaling waits before checking the health status of an EC2 instance that has come into service.
      grace_time_minutes: 15
    cpu_utilization_scaling_policy:
      target_utilization_percent: 80
      estimated_instance_warmup_minutes: 15
    rolling_update_policy:
      max_batch_size: 1
      min_instances_in_service: 1
      pause_time_minutes: 15
    # instance metadata access method
    metadata_http_tokens: "required"  # supported values are "required" for IMDSv2 or "optional" for IMDSv1
  client_communication_port: 8444 # DO NOT CHANGE
  agent_communication_port: 8445 # DO NOT CHANGE
  gateway_communication_port: 8446 # DO NOT CHANGE
  # SSL/TLS Policy on VDC HTTPS listeners
  # For a list of policies - consult the documentation at https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html#describe-ssl-policies
  ssl_policy: ELBSecurityPolicy-FS-1-2-Res-2020-10
  session_token_validity: 1440 # in minutes
  dynamodb_table:
    autoscaling:
      enabled: true
    read_capacity:
      min_units: 5
      max_units: 20
      target_utilization: 70 # in percentage
      scale_in_cooldown: 60 # in seconds
      scale_out_cooldown: 60 # in seconds
    write_capacity:
      min_units: 5
      max_units: 101
      target_utilization: 70 # in percentage
      scale_in_cooldown: 60 # in seconds
      scale_out_cooldown: 60 # in seconds

dcv_connection_gateway:
  autoscaling:
    public: false
    instance_type: {{instance_type}}
    base_os: {{base_os}}
    instance_ami: {{instance_ami}}
    volume_size: {{volume_size}}
    volume_type: {{volume_type}}
    enabled_detailed_monitoring: false
    min_capacity: 1
    max_capacity: 3
    cooldown_minutes: 5
    new_instances_protected_from_scale_in: false
    elb_healthcheck:
      # Specifies the time in minutes Auto Scaling waits before checking the health status of an EC2 instance that has come into service.
      grace_time_minutes: 15
    cpu_utilization_scaling_policy:
      target_utilization_percent: 80
      estimated_instance_warmup_minutes: 15
    rolling_update_policy:
      max_batch_size: 1
      min_instances_in_service: 1
      pause_time_minutes: 15
    # instance metadata access method
    metadata_http_tokens: "required"  # supported values are "required" for IMDSv2 or "optional" for IMDSv1
  certificate:
    provided: {{ dcv_connection_gateway_custom_certificate_provided | lower }}
    custom_dns_name: {{ dcv_connection_gateway_custom_dns_hostname if dcv_connection_gateway_custom_dns_hostname else '~' }}
    certificate_secret_arn: {{ dcv_connection_gateway_custom_certificate_certificate_secret_arn if dcv_connection_gateway_custom_certificate_certificate_secret_arn else '~' }}
    private_key_secret_arn: {{ dcv_connection_gateway_custom_certificate_private_key_secret_arn if dcv_connection_gateway_custom_certificate_private_key_secret_arn else '~' }}

external_nlb:
  # external NLB access logs are enabled by default
  access_logs: true

opensearch:
  dcv_session:
    alias: {{cluster_name}}_{{module_id}}_user_sessions
  software_stack:
    alias: {{cluster_name}}_{{module_id}}_software_stacks
  session_permission:
    alias: {{cluster_name}}_{{module_id}}_session_permission

dcv_session:
  idle_timeout: 240 # in minutes. Default is 240-minutes / 4-hours
  idle_timeout_warning: 300 # in seconds
  idle_autostop_delay: 60 # Time (in minutes) a disconnected (but running) DCV session is eligible for autostop. Default is 60-minutes / 1-hour
  idle_autostop_delay_max: 240 # Upper bound (in minutes) for the per-session idle_autostop_delay a user may set. Set to 0 to disable per-session overrides
  cpu_utilization_threshold: 30 # in percentage. If a given session has more than this much CPU activity - autostop will not take place
  max_root_volume_memory: 1000 # in GB
  additional_security_groups: []
  allowed_sessions_per_user: 5
  validation_timeout_minutes: 2 # Maximum time to wait for DCV broker validation before forcing EC2 stop/terminate to prevent indefinite running costs
  # seconds a session may stay in PROVISIONING before it errors and releases its instance.
  # must match scheduler.job_provisioning.stack_provisioning_timeout_seconds; set to 0 to disable the timeout.
  provisioning_timeout_seconds: 1800
  # deletes desktops that have sat stopped past a cutoff, and session records whose instance is gone,
  # through the normal delete path. off by default; enable with dry_run on first and read the controller log.
  stopped_session_reaper:
    enabled: false # run the sweep on the 30-minute schedule
    dry_run: true # log what would be deleted without deleting anything
    stopped_after_days: 30 # a desktop stopped longer than this, per the ec2 stop time, is deleted
    warn_days_before: 7 # email the owner this many days before deletion and wait that long before deleting; 0 sends no notice
    max_per_pass: 25 # deletions per pass; the rest are picked up on the next pass
    keep_tags: ['idea:keep', 'ideal:keep'] # an instance carrying any of these tag keys is never deleted
  instance_types:
    allow: # Supports both instance families and types. E.g. specify t3 for family and t3.large for instance type
      - t3
      - g4dn
      - g4ad
      - g5
      - m6a
      - m6g
    deny: [] # Supports both instance families and types. E.g. specify t3 for family and t3.large for instance type
  quic_support: {{ dcv_session_quic_support | lower }}

  # by default, eVDI subnets match cluster.network.private_subnets; override here if needed.
  network:
    private_subnets:
      {{ utils.to_yaml(private_subnet_ids) | indent(6) }}

    # if true, randomizes subnet selection for deployment; default (false) uses the order given.
    randomize_subnets: False

    # if true (default), retries the next subnet on a deployment error; set false to fail fast and avoid cross-AZ charges.
    subnet_autoretry: True

  # instance metadata access method
  metadata_http_tokens: "required"  # supported values are "required" for IMDSv2 or "optional" for IMDSv1

  notifications:
    provisioning:
      enabled: false
      email_template: virtual-desktop-controller.session-provisioning
    creating:
      enabled: false
      email_template: virtual-desktop-controller.session-creating
    initializing:
      enabled: false
      email_template: virtual-desktop-controller.session-initializing
    resuming:
      enabled: false
      email_template: virtual-desktop-controller.session-resuming
    ready:
      enabled: true
      email_template: virtual-desktop-controller.session-ready
    stopping:
      enabled: false
      email_template: virtual-desktop-controller.session-stopping
    stopped:
      enabled: true
      email_template: virtual-desktop-controller.session-stopped
    deleting:
      enabled: false
      email_template: virtual-desktop-controller.session-deleting
    error:
      enabled: true
      email_template: virtual-desktop-controller.session-error
    deleted:
      enabled: true
      email_template: virtual-desktop-controller.session-deleted
    reaper_warning:
      enabled: true
      email_template: virtual-desktop-controller.session-reaper-warning
    session-shared:
      enabled: true
      email_template: virtual-desktop-controller.session-shared
    session-permission-updated:
      enabled: true
      email_template: virtual-desktop-controller.session-permission-updated
    session-permission-expired:
      enabled: true
      email_template: virtual-desktop-controller.session-permission-expired

  working_hours:
    start_up_time: '09:00'
    shut_down_time: '17:00'

  # default per-day schedule; type is one of NO_SCHEDULE, WORKING_HOURS, STOP_ON_IDLE, START_ALL_DAY, CUSTOM_SCHEDULE.
  # start_up_time/shut_down_time are required only when type is CUSTOM_SCHEDULE.
  schedule:
    monday:
      type: STOP_ON_IDLE
      start_up_time: ~
      shut_down_time: ~
    tuesday:
      type: STOP_ON_IDLE
      start_up_time: ~
      shut_down_time: ~
    wednesday:
      type: STOP_ON_IDLE
      start_up_time: ~
      shut_down_time: ~
    thursday:
      type: STOP_ON_IDLE
      start_up_time: ~
      shut_down_time: ~
    friday:
      type: STOP_ON_IDLE
      start_up_time: ~
      shut_down_time: ~
    saturday:
      type: STOP_ON_IDLE
      start_up_time: ~
      shut_down_time: ~
    sunday:
      type: STOP_ON_IDLE
      start_up_time: ~
      shut_down_time: ~
  default_profiles:
    admin: admin_profile
    owner: owner_profile

# Instance storage configuration for virtual desktop sessions
instance_storage:
  # Configure mount point for instance store devices (NVMe/SSD)
  mount_point: /scratch

# claude code defaults seeded onto a desktop whose project has bedrock model access. seeded
# as user settings, so the desktop owner can change them afterwards.
bedrock:
  claude_code:
    # auto, default, acceptEdits or plan. none seeds no permissions block at all.
    permission_mode: auto

logging:
  logs_directory: /opt/idea/app/logs
  profile: production
  default_log_file_name: application.log

cloudwatch_logs:
  enabled: true

cache:
  long_term:
    max_size: 1000
    ttl_seconds: 86400 # 1 day
  short_term:
    max_size: 10000
    ttl_seconds: 600 # 10 minutes


vdi_host_backup:
  enabled: {{ enable_aws_backup | lower }}
  backup_plan:
    selection:
      tags:
        - "Key=idea:BackupPlan,Value={{ cluster_name }}-{{ module_id }}"
    rules:
      default:
        delete_after_days: 7
        move_to_cold_storage_after_days: ~
        schedule_expression: "cron(0 5 * * ? *)"
        start_window_minutes: 60 # 1 hour
        completion_window_minutes: 480 # 8 hours
