Version: '2012-10-17'
Statement:

  # A compute node and a compute image builder read only their bootstrap package from the cluster
  # bucket. The rest of the bucket (scheduler logs, accounting, other modules' packages) is not theirs.
  # A host fetches one key it is given, so it holds no listing of the prefix.
  {% set bucket = context.config.get_string('cluster.cluster_s3_bucket', required=True) %}
  - Sid: AllowReadAccessForClusterS3Bucket
    Action:
      - s3:GetObject
    Resource:
      - '{{ context.arns.get_arn("s3", bucket + "/idea/" + context.module_id + "/bootstrap/*", aws_account_id="", aws_region="") }}'
    Effect: Allow

  - Action:
      - s3:GetObject
      - s3:ListBucket
    Resource:
      {{ context.utils.to_yaml(context.arns.s3_global_arns) | indent(6) }}
    Effect: Allow

  # A GPU driver mirror an operator configured outside AWS's driver buckets: the recursive copy
  # lists and reads that prefix only.
  {% for mirror in context.arns.gpu_driver_mirrors %}
  - Action: s3:GetObject
    Resource: '{{ mirror.objects }}'
    Effect: Allow
  - Action: s3:ListBucket
    Resource: '{{ mirror.bucket }}'
    Condition:
      StringLike:
        s3:prefix: '{{ mirror.prefix }}'
    Effect: Allow
  {% endfor %}

  # Bootstrap copies the cluster, module and job tags (and the cluster's custom tags) onto the
  # host's own volumes and network interfaces, which are untagged or carry this cluster's name. IAM
  # cannot tell which volume is attached to the caller, so a volume or interface that names another
  # cluster is refused; launch-time tagging is what removes this grant.
  - Action:
      - ec2:CreateTags
    Resource:
      - '{{ context.arns.get_arn("ec2", "volume/*") }}'
      - '{{ context.arns.get_arn("ec2", "network-interface/*") }}'
    Condition:
      StringEqualsIfExists:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
    Effect: Allow

  # On an instance a host writes only its own bootstrap or image build status; the identity tags
  # the product trusts are set at launch and cannot be changed from the host. IAM accepts a policy
  # variable only after the ARN's fifth colon, so the instance is matched in the condition: the
  # tagged instance's ARN must be the one the calling credentials were issued to.
  - Action:
      - ec2:CreateTags
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      ArnEquals:
        ec2:SourceInstanceARN: '{{ context.arns.get_arn("ec2", "instance/${ec2:InstanceID}") }}'
      ForAllValues:StringEquals:
        aws:TagKeys:
          - idea:BootstrapStatus
          - idea:BootstrapDetail
          - idea:AmiBuilderStatus
    Effect: Allow

  - Action:
      - ec2:DescribeVolumes
      - ec2:DescribeNetworkInterfaces
      - fsx:DescribeFileSystems
      - tag:GetResources
    Resource: '*'
    Effect: Allow

  - Action:
      - sqs:SendMessage
    Resource:
      - '{{ context.arns.get_sqs_arn(context.module_id + "-job-status-events") }}'
    Effect: Allow
    Sid: JobStatusEvents


