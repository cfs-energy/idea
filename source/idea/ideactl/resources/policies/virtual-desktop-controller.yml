Version: '2012-10-17'
Statement:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
    Resource: '{{ context.arns.get_ddb_table_arn("accounts.users") }}'

  - Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:Query
    Resource:
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}'
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}/index/*'

  # A token's use is recorded; its owner, scope and expiry are written only by the cluster manager.
  - Effect: Allow
    Action:
      - dynamodb:UpdateItem
    Resource: '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}'
    Condition:
      ForAllValues:StringEquals:
        dynamodb:Attributes: [token_id, last_used_on]

  - Effect: Allow
    Action:
      - cognito-idp:AdminListGroupsForUser
    Resource: '{{ context.arns.user_pool_arn }}'

  - Action:
      - ec2:DescribeVolumes
      - ec2:DescribeSubnets
      - ec2:DescribeNetworkInterfaces
      - ec2:DescribeImageAttribute
      - ec2:DescribeImages
      - ec2:DescribeLaunchTemplates
      - ec2:DescribeLaunchTemplateVersions
      - ec2:DescribeInstances
      - ec2:DescribeInstanceStatus
      - ec2:DescribeInstanceTypes
      - ec2:DeregisterImage
      - fsx:DescribeFileSystems
      - ssm:ListDocuments
      - ssm:ListDocumentVersions
      - ssm:DescribeDocument
      - ssm:GetDocument
      - ssm:DescribeInstanceInformation
      - ssm:DescribeDocumentParameters
      - ssm:DescribeInstanceProperties
      - ssm:ListCommands
      - ssm:GetCommandInvocation
      - ssm:DescribeAutomationExecutions
      - dynamodb:ListTables
      - application-autoscaling:RegisterScalableTarget
      - application-autoscaling:PutScalingPolicy
      - application-autoscaling:DescribeScalingPolicies
      - budgets:ViewBudget
    Resource: '*'
    Effect: Allow

  - Action:
      - autoscaling:DescribeAutoScalingGroups
      - autoscaling:DescribeAutoScalingInstances
      - autoscaling:DescribeLaunchConfigurations
      - autoscaling:DescribeScalingActivities
      - autoscaling:DescribeTags
      - autoscaling:DescribeWarmPool
    Resource: '*'
    Effect: Allow

  # Desktops and desktop image builders: only instances carrying this cluster's and this module's
  # tags are started, stopped, rebooted, resized, retagged, imaged or terminated. Compute nodes,
  # the directory server and container hosts carry another module id or none.
  - Action:
      - ec2:StartInstances
      - ec2:StopInstances
      - ec2:RebootInstances
      - ec2:TerminateInstances
      - ec2:ModifyInstanceAttribute
      - ec2:CreateTags
      - ec2:DeleteTags
      - ec2:CreateImage
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      StringEquals:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        aws:ResourceTag/idea:ModuleId: '{{ context.config.get_module_id('virtual-desktop-controller') }}'
    Effect: Allow
  # The identity tags the grants above and Run Command key on are written only at launch, so a
  # role cannot bring another instance into its own reach by retagging it.
  - Sid: IdentityTagsSetOnlyAtLaunch
    Action:
      - ec2:CreateTags
      - ec2:DeleteTags
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      ForAnyValue:StringEquals:
        aws:TagKeys: [idea:ClusterName, idea:NodeType, idea:ModuleId]
      'Null':
        ec2:CreateAction: 'true'
    Effect: Deny

  # A launch must tag the new instance with this cluster's name, which is what the statement above
  # matches afterwards. The image, subnet, interface, groups, volumes and key a launch or an image
  # names carry no such tag, so they are allowed by every resource that is not an instance.
  - Action: ec2:RunInstances
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      StringEquals:
        aws:RequestTag/idea:ClusterName: '{{ context.cluster_name }}'
    Effect: Allow
  - Action:
      - ec2:RunInstances
      - ec2:CreateImage
    NotResource: '{{ context.arns.get_arn("ec2", "instance/*", aws_account_id="*", aws_region="*") }}'
    Effect: Allow

  # The tags a launch or an image request writes on what it creates.
  - Action: ec2:CreateTags
    Resource:
      - '{{ context.arns.get_arn("ec2", "instance/*") }}'
      - '{{ context.arns.get_arn("ec2", "image/*", aws_account_id="*") }}'
      - '{{ context.arns.get_arn("ec2", "snapshot/*", aws_account_id="*") }}'
    Condition:
      StringEquals:
        ec2:CreateAction:
          - RunInstances
          - CreateImage
    Effect: Allow

  # Run Command: the controller sends only the two AWS shell documents, and only to this cluster's
  # desktops and desktop image builders.
  - Action: ssm:SendCommand
    Resource:
      - '{{ context.arns.get_arn("ssm", "document/AWS-RunShellScript", aws_account_id="") }}'
      - '{{ context.arns.get_arn("ssm", "document/AWS-RunPowerShellScript", aws_account_id="") }}'
    Effect: Allow
  - Action: ssm:SendCommand
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      StringEquals:
        ssm:resourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        ssm:resourceTag/idea:ModuleId: '{{ context.config.get_module_id('virtual-desktop-controller') }}'
    Effect: Allow

  - Action:
      - s3:GetObject
      - s3:ListBucket
      - s3:GetBucketAcl
    Resource:
      {{ context.utils.to_yaml(context.arns.s3_bucket_arns) | indent(6) }}
    Effect: Allow
  # The controller writes its own host packages (desktops, image builds), nothing else in the bucket.
  - Action: s3:PutObject
    Resource:
      - '{{ context.arns.s3_bucket_arns[1] }}/idea/{{ context.config.get_module_id('virtual-desktop-controller') }}/bootstrap/*'
      - '{{ context.arns.s3_bucket_arns[1] }}/idea/{{ context.config.get_module_id('virtual-desktop-controller') }}/dcv-host-bootstrap/*'
    Effect: Allow

  - Effect: Allow
    Action:
      - sqs:DeleteMessage
      - sqs:ReceiveMessage
      - sqs:SendMessage
      - sqs:GetQueueAttributes
    Resource:
      - '{{ context.arns.get_sqs_arn(context.config.get_module_id("virtual-desktop-controller") + "-events.fifo") }}'
      - '{{ context.arns.get_sqs_arn(context.config.get_module_id("virtual-desktop-controller") + "-controller") }}'


  - Action:
      - dynamodb:GetItem
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:DescribeTable
      - dynamodb:DescribeStream
      - dynamodb:GetRecords
      - dynamodb:GetShardIterator
      - dynamodb:ListStreams
    Resource:
      {{ context.utils.to_yaml(context.arns.cluster_config_ddb_arn) | indent(6) }}
    Effect: Allow

  # The controller's only cluster-settings writes: the release it seeded base stacks for, the image
  # pipeline's release and monthly checkpoints, and the refresh schedule an admin edits.
  - Action:
      - dynamodb:UpdateItem
    Resource: '{{ context.arns.get_ddb_table_arn("cluster-settings") }}'
    Condition:
      ForAllValues:StringEquals:
        dynamodb:LeadingKeys:
          {% set vdc = context.config.get_module_id("virtual-desktop-controller") %}
          - '{{ vdc }}.software_stacks.base_stacks_seeded_release'
          - '{{ vdc }}.software_stacks.images_baked_release'
          - '{{ vdc }}.software_stacks.image_refresh_last_run_on'
          - '{{ vdc }}.software_stacks.expiry_last_digest_on'
          - '{{ vdc }}.software_stacks.image_refresh_schedule.enabled'
          - '{{ vdc }}.software_stacks.image_refresh_schedule.day'
          - '{{ vdc }}.software_stacks.image_refresh_schedule.hour'
    Effect: Allow

  # A failed desktop or bake keeps what its host's console said; only this cluster's hosts.
  - Action:
      - ec2:GetConsoleOutput
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      StringEquals:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
    Effect: Allow

  # Image validation reads the bootstrap completion line from desktop and builder logs.
  - Action:
      - logs:FilterLogEvents
      - logs:GetLogEvents
    Resource:
      - '{{ context.arns.get_log_group_arn("/" + context.config.get_module_id("virtual-desktop-controller") + "/dcv-host*") }}'
      - '{{ context.arns.get_log_group_arn("/" + context.config.get_module_id("virtual-desktop-controller") + "/ami-builder*") }}'
    Effect: Allow

  # Image cleanup deletes the snapshots of this cluster's desktop builder images, nothing else, and
  # reads the queues and compute image rows first so an image named there is kept.
  - Action:
      - ec2:DeleteSnapshot
    Resource: '{{ context.arns.get_arn("ec2", "snapshot/*", aws_account_id="") }}'
    Condition:
      StringEquals:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        aws:ResourceTag/idea:AmiBuilder: 'true'
        aws:ResourceTag/idea:ModuleName: virtual-desktop-controller
    Effect: Allow
{% if context.config.is_module_enabled('scheduler') %}

  - Action: dynamodb:Scan
    Resource:
      - '{{ context.arns.get_ddb_table_arn(context.config.get_module_id("scheduler") + ".queue-profiles") }}'
      - '{{ context.arns.get_ddb_table_arn(context.config.get_module_id("scheduler") + ".image-builds") }}'
    Effect: Allow
{% endif %}

  - Action:
      - dynamodb:BatchGet*
      - dynamodb:DescribeStream
      - dynamodb:DescribeTable
      - dynamodb:Get*
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:BatchWrite*
      - dynamodb:CreateTable
      - dynamodb:Delete*
      - dynamodb:Update*
      - dynamodb:PutItem
      - dynamodb:TagResource
    Resource:
      - '{{ context.arns.get_ddb_table_arn(context.config.get_module_id("virtual-desktop-controller") + ".*") }}'
    Effect: Allow

  - Action:
      - cloudwatch:PutMetricData
    Resource: '*'
    Effect: Allow

  # desktops deleted before 26.10.6 get their instance id back from the RunInstances
  # events in CloudTrail's 90 days. read only; LookupEvents takes no resource scoping.
  - Action:
      - cloudtrail:LookupEvents
    Resource: '*'
    Effect: Allow

  - Action:
      - secretsmanager:GetSecretValue
    Condition:
      StringEquals:
        secretsmanager:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        secretsmanager:ResourceTag/idea:ModuleName: virtual-desktop-controller
    Resource: '*'
    Effect: Allow

  - Action:
      - sqs:SendMessage
    Resource:
      - '{{ context.arns.get_sqs_arn(context.config.get_module_id("cluster-manager") + "-notifications.fifo") }}'
    Effect: Allow
    Sid: SendUserNotifications

  - Action:
      - logs:PutRetentionPolicy
    Resource: '{{ context.arns.get_log_group_arn("/*") }}'
    Effect: Allow

  - Action:
      - kinesis:PutRecord
      - kinesis:PutRecords
    Resource:
      - '{{ context.arns.get_kinesis_arn() }}'
    Effect: Allow

  - Action:
      - iam:CreateServiceLinkedRole
    Resource: '{{ context.arns.get_ddb_application_autoscaling_service_role_arn() }}'
    Effect: Allow
    Condition:
      StringLike:
        iam:AWSServiceName: 'dynamodb.application-autoscaling.amazonaws.com'

  # The desktop project move's grants are in vdc.ts (desktop-move policy): this template is at
  # its size limit.


  {% include '_templates/aws-managed-ad.yml' %}

  {% include '_templates/activedirectory.yml' %}

  {% include '_templates/openldap.yml' %}

  {% include '_templates/custom-kms-key.yml' %}
