# The compute image pipeline: the SSM commands and image creation of the AMI builder, the tag
# promotion puts on a validated image, and the settings rows promotion and the checkpoints write.
# Rendered into a customer-managed policy attached to the scheduler host and task roles, for the
# inline size limit scheduler-read-only.yml describes.
Version: '2012-10-17'
Statement:
  - Action:
      - ssm:SendCommand
    Resource:
      - '{{ context.arns.get_arn("ec2", "instance/*") }}'
      - '{{ context.arns.get_arn("ssm", "document/AWS-RunPowerShellScript", aws_account_id="") }}'
      - '{{ context.arns.get_arn("ssm", "document/AWS-RunShellScript", aws_account_id="") }}'
    Effect: Allow

  - Action:
      - ssm:StartAutomationExecution
    Resource:
      - '{{ context.arns.get_ssm_arn("automation-definition/") }}'
    Effect: Allow

  - Action:
      - ssm:StopAutomationExecution
      - ssm:GetAutomationExecution
    Resource:
      - '{{ context.arns.get_ssm_arn("automation-execution/") }}'
    Effect: Allow

  - Effect: Allow
    Action:
      - ec2:CreateSnapshot
      - ec2:CreateImage
    Resource:
      - '*'
    Sid: ComputeNodeAmiBuilderPermissions1

  - Effect: Allow
    Action:
      - ec2:CreateTags
    Condition:
      StringEquals:
        ec2:CreateAction:
          - CreateImage
    Resource:
      - '*'
    Sid: ComputeNodeAmiBuilderPermissions2

  # Compute image promotion marks the image it validated (rollback only returns to marked images).
  - Effect: Allow
    Action:
      - ec2:CreateTags
    Condition:
      StringEquals:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
    Resource:
      - '{{ context.arns.get_arn("ec2", "image/*", aws_account_id="") }}'
    Sid: ComputeImagePromotionTag

  # Image cleanup deregisters, and deletes the snapshots of, only this cluster's compute builder
  # images (pipeline bakes and older or manual builds); it reads the desktop stacks and image rows
  # first so an image named there is kept.
  - Effect: Allow
    Action:
      - ec2:DeregisterImage
      - ec2:DeleteSnapshot
    Condition:
      StringEquals:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        aws:ResourceTag/idea:AmiBuilder: 'true'
        aws:ResourceTag/idea:ModuleName: scheduler
    Resource:
      - '{{ context.arns.get_arn("ec2", "image/*", aws_account_id="") }}'
      - '{{ context.arns.get_arn("ec2", "snapshot/*", aws_account_id="") }}'
    Sid: ComputeImageCleanup
{% if context.config.is_module_enabled('virtual-desktop-controller') %}

  - Effect: Allow
    Action: dynamodb:Scan
    Resource:
      - '{{ context.arns.get_ddb_table_arn(context.config.get_module_id("virtual-desktop-controller") + ".controller.software-stacks") }}'
      - '{{ context.arns.get_ddb_table_arn(context.config.get_module_id("virtual-desktop-controller") + ".controller.image-builds") }}'
    Sid: ImageReferenceReads
{% endif %}

  # The scheduler's only cluster-settings writes: promotion moves the compute default in the same
  # transaction that checks its pin, and the leader records its release and monthly checkpoints.
  - Effect: Allow
    Action:
      - dynamodb:UpdateItem
      - dynamodb:ConditionCheckItem
    Resource: '{{ context.arns.get_ddb_table_arn("cluster-settings") }}'
    Condition:
      ForAllValues:StringEquals:
        dynamodb:LeadingKeys:
          - '{{ context.module_id }}.compute_node_ami'
          - '{{ context.module_id }}.images.default_image_pinned'
          - '{{ context.module_id }}.images.image_refresh_last_run_on'
          - '{{ context.module_id }}.images.refreshed_release'
    Sid: ComputeImageSettings
