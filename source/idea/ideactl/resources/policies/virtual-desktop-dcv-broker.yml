Version: '2012-10-17'
Statement:
  # The broker keeps its sessions in its own tables (dynamodb-table-name-prefix in roles/broker.sh),
  # creating them on first start, and publishes its metrics to CloudWatch. The role script's one read
  # of cluster-settings is granted by the stack. Its logs go through the execution role and command
  # sessions through the instance managed policies, so nothing else is needed here.
  - Action:
      - dynamodb:BatchGet*
      - dynamodb:DescribeStream
      - dynamodb:DescribeTable
      - dynamodb:Get*
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:BatchWrite*
      - dynamodb:CreateTable
      - dynamodb:Delete*
      - dynamodb:Update*
      - dynamodb:PutItem
    Resource:
      - '{{ context.arns.get_ddb_table_arn(context.config.get_module_id("virtual-desktop-controller") + ".dcv-broker.*") }}'
    Effect: Allow
  - Action:
      - cloudwatch:PutMetricData
    Resource: '*'
    Effect: Allow

{% include '_templates/custom-kms-key.yml' %}
