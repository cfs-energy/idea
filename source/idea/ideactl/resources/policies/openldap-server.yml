Version: '2012-10-17'
Statement:
  - Action:
      - ec2:DescribeVolumes
      - ec2:DescribeNetworkInterfaces
    Resource: '*'
    Effect: Allow

  # The server tags its own volumes and interfaces, which are untagged or carry this cluster's name.
  - Action:
      - ec2:CreateTags
    Resource:
      - '{{ context.arns.get_arn("ec2", "volume/*") }}'
      - '{{ context.arns.get_arn("ec2", "network-interface/*") }}'
    Condition:
      StringEqualsIfExists:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
    Effect: Allow

  # The server fetches one key, its bootstrap package (bootstrap-package.ts bootstrapPackageUri).
  - Action:
      - s3:GetObject
    Resource:
      - '{{ context.arns.s3_bucket_arns[1] }}/idea/bootstrap/*'
    Effect: Allow

  # On a failed bootstrap the server writes only its own status tag (bootstrap_common.sh).
  - Action:
      - ec2:CreateTags
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      ArnEquals:
        ec2:SourceInstanceARN: '{{ context.arns.get_arn("ec2", "instance/${ec2:InstanceID}") }}'
      ForAllValues:StringEquals:
        aws:TagKeys:
          - idea:BootstrapStatus
    Effect: Allow

  - Action:
      - secretsmanager:GetSecretValue
    Condition:
      StringEquals:
        secretsmanager:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        secretsmanager:ResourceTag/idea:ModuleName: directoryservice
    Resource: '*'
    Effect: Allow


{% include '_templates/custom-kms-key.yml' %}
