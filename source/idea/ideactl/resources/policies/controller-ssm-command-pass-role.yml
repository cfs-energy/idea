Version: '2012-10-17'
Statement:
  - Action:
      - sns:Publish
    Resource:
      - '{{ context.arns.get_sns_arn(context.config.get_module_id("virtual-desktop-controller") + "-ssm-commands-sns-topic") }}'
    Effect: Allow

  # Run Command writes any S3 or CloudWatch output with the instance's own role; this role only
  # publishes the command's status notifications.

  - Action:
      - logs:CreateLogGroup
      - logs:CreateLogStream
      - logs:PutLogEvents
    Resource:
      - '{{ context.arns.get_log_group_arn("/" + context.config.get_module_id("virtual-desktop-controller") + "/dcv-session/*") }}'
    Effect: Allow

    {% if context.config.get_string('cluster.sns.kms_key_id') %}
  - Action:
      - kms:GenerateDataKey
      - kms:Decrypt
    Resource:
      - '{{ context.arns.kms_sns_key_arn }}'
    Effect: Allow
    {% endif %}
