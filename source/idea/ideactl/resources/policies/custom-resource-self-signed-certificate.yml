Version: '2012-10-17'
Statement:
  - Action:
      - logs:CreateLogGroup
    Resource: '{{ context.arns.get_lambda_log_group_arn() }}'
    Effect: Allow
    Sid: CloudWatchLogsPermissions

  - Action:
      - logs:CreateLogStream
      - logs:PutLogEvents
    Resource: '{{ context.arns.lambda_log_stream_arn }}'
    Effect: Allow
    Sid: CloudWatchLogStreamPermissions

  # The handler only finds the certificate and the two secrets the deploy tool imported.
  - Action:
      - acm:ListCertificates
    Resource: '*'
    Effect: Allow
    Sid: ACMPermissions

  - Action:
      - secretsmanager:ListSecrets
    Resource: '*'
    Effect: Allow
    Sid: SecretsManagerPermissions
