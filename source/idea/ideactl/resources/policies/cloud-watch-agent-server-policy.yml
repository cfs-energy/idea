Version: '2012-10-17'
Statement:
  - Effect: Allow
    Action:
      - cloudwatch:PutMetricData
      - ec2:DescribeVolumes
      - ec2:DescribeTags
      - logs:DescribeLogStreams
      - logs:DescribeLogGroups
    Resource: '*'
  # Every host and task that carries this policy writes its logs under /<cluster>/; groups outside
  # the cluster's tree are not theirs to create or write.
  - Effect: Allow
    Action:
      - logs:PutLogEvents
      - logs:CreateLogStream
      - logs:CreateLogGroup
    Resource: '{{ context.arns.get_log_group_arn("/*") }}'
