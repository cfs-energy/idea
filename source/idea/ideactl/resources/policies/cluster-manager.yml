Version: '2012-10-17'
Statement:
  - Action: sqs:SendMessage
    Resource:
      - '{{ context.arns.get_sqs_arn(context.config.get_module_id("virtual-desktop-controller") + "-controller") }}'
    Effect: Allow
  - Action:
      - ec2:DescribeVolumes
      - ec2:DescribeNetworkInterfaces
      - ec2:DescribeInstances
      - ec2:DescribeInstanceTypes
      - fsx:DescribeFileSystems
      - elasticfilesystem:DescribeFileSystems
      - pricing:GetProducts
      - budgets:ViewBudget
      - logs:PutRetentionPolicy
    {% if context.config.get_bool(context.module_id + '.bedrock.enabled', False) %}
      - bedrock:ListInferenceProfiles
      - bedrock:GetModelInvocationLoggingConfiguration
      - bedrock:PutModelInvocationLoggingConfiguration
      - logs:GetQueryResults
      - logs:StopQuery
    {% endif %}
    {% if context.config.get_bool(context.module_id + '.bedrock.enabled', False) or context.config.get_bool(context.module_id + '.metrics.cost.enabled', False) %}
      - ce:GetCostAndUsage
    {% endif %}
    {% if context.config.get_bool(context.module_id + '.metrics.cost.enabled', False) %}
      - ce:GetTags
      - ce:GetDimensionValues
    {% endif %}
    Resource: '*'
    Effect: Allow

  - Action:
      - ec2:CreateTags
    Resource:
      - '{{ context.arns.get_arn("ec2", "volume/*", aws_region="*") }}'
      - '{{ context.arns.get_arn("ec2", "network-interface/*", aws_region="*") }}'
    Effect: Allow

  - Action:
      - ses:SendEmail
    Resource:
      - '{{ context.arns.ses_arn }}'
    Effect: Allow

  - Action:
      - s3:GetObject
      - s3:ListBucket
      - s3:PutObject
      - s3:GetBucketAcl
    Resource:
      {{ context.utils.to_yaml(context.arns.s3_bucket_arns) | indent(6) }}
    Effect: Allow

  # The cost and storage collectors retire an outbox object once it is sent; only that prefix.
  - Action:
      - s3:DeleteObject
    Resource:
      - '{{ context.arns.s3_bucket_arns[1] }}/metrics/outbox/*'
    Effect: Allow

  - Action:
      - dynamodb:GetItem
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:DescribeTable
      - dynamodb:DescribeStream
      - dynamodb:GetRecords
      - dynamodb:GetShardIterator
      - dynamodb:ListStreams
      - dynamodb:UpdateItem
      - dynamodb:PutItem
      - dynamodb:DeleteItem
      - dynamodb:TagResource
      - dynamodb:CreateTable
      - dynamodb:UpdateTable
      - dynamodb:UpdateTimeToLive
    Resource:
      - '{{ context.arns.get_ddb_table_arn("cluster-settings") }}'
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.personal-costs") }}'
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.reporting-snapshots") }}'
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}'
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}/index/*'
      - '{{ context.arns.get_ddb_table_arn("cluster-settings/stream/*") }}'
      - '{{ context.arns.get_ddb_table_arn("modules") }}'
      - '{{ context.arns.get_ddb_table_arn("email-templates") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.sequence-config") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.users") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.groups") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.group-members") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.sso-state") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.group-members/stream/*") }}'
      - '{{ context.arns.get_ddb_table_arn("projects") }}'
      - '{{ context.arns.get_ddb_table_arn("projects/index/*") }}'
      - '{{ context.arns.get_ddb_table_arn("projects.user-projects") }}'
      - '{{ context.arns.get_ddb_table_arn("projects.project-groups") }}'
      - '{{ context.arns.get_ddb_table_arn("ad-automation") }}'
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".distributed-lock") }}'
    Effect: Allow

  - Action:
      - cloudwatch:PutMetricData
    Resource: '*'
    Effect: Allow
    Condition:
      StringLike:
        cloudwatch:namespace: IDEA/*

    {% if context.config.get_string('directoryservice.provider') == 'aws_managed_activedirectory' %}
  - Action:
      - ds:ResetUserPassword
    Resource: '{{ context.arns.get_directory_service_arn() }}'
    Effect: Allow
    {% endif %}


  # PutSecret value is required so that cluster-manager can refresh directory service credentials when nearing expiration
  - Action:
      - secretsmanager:GetSecretValue
      - secretsmanager:PutSecretValue
    Condition:
      StringEquals:
        secretsmanager:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        secretsmanager:ResourceTag/idea:ModuleName:
          - cluster-manager
          - directoryservice
    Resource: '*'
    Effect: Allow

  # Allow cluster-manager to access JWT signing secrets for secure file downloads
  - Action:
      - secretsmanager:GetSecretValue
    Condition:
      StringEquals:
        secretsmanager:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        secretsmanager:ResourceTag/idea:SecretType: 'jwt-signing'
    Resource: '*'
    Effect: Allow

  - Action:
      - cognito-idp:*
    Resource: '{{ context.arns.user_pool_arn }}'
    Effect: Allow

  - Action:
      - sqs:*
    Resource:
      - '{{ context.arns.get_sqs_arn(context.module_id + "-tasks.fifo") }}'
      - '{{ context.arns.get_sqs_arn(context.module_id + "-notifications.fifo") }}'
      - '{{ context.arns.get_sqs_arn(context.config.get_module_id("directoryservice") + "-ad-automation.fifo") }}'
    Effect: Allow
    Sid: ClusterManagerSQSQueues

  - Action:
      - kinesis:PutRecord
      - kinesis:PutRecords
    Resource:
      - '{{ context.arns.get_kinesis_arn() }}'
    Effect: Allow

    {% if context.config.get_bool(context.module_id + '.bedrock.enabled', False) %}
  # role creation is conditioned on the project permissions boundary, so the role can never exceed it.
  - Action:
      - iam:CreateRole
      - iam:PutRolePermissionsBoundary
    Resource:
      - '{{ context.arns.get_project_role_arn() }}'
    Effect: Allow
    Condition:
      StringEquals:
        iam:PermissionsBoundary: '{{ context.arns.get_project_permissions_boundary_arn() }}'

  # only project owned policies, cluster owned managed policies, and the ec2 managed policies named here are attachable.
  # any other aws managed policy is excluded: the boundary alone wouldn't stop something like AdministratorAccess.
  - Action:
      - iam:AttachRolePolicy
      - iam:DetachRolePolicy
    Resource:
      - '{{ context.arns.get_project_role_arn() }}'
    Effect: Allow
    Condition:
      StringEquals:
        iam:PermissionsBoundary: '{{ context.arns.get_project_permissions_boundary_arn() }}'
      ArnLike:
        iam:PolicyARN:
          - '{{ context.arns.get_project_policy_arn() }}'
          - '{{ context.arns.get_arn("iam", "policy/" + context.cluster_name + "-*", aws_region="") }}'
        {%- for policy_arn in context.config.get_list("cluster.iam.ec2_managed_policy_arns", []) %}
          - '{{ policy_arn }}'
        {%- endfor %}
        {%- for key in ["cluster.iam.policies.amazon_ssm_managed_instance_core_arn", "cluster.iam.policies.cloud_watch_agent_server_arn", "cluster.iam.policies.amazon_prometheus_remote_write_arn"] %}
        {%- if context.config.get_string(key) %}
          - '{{ context.config.get_string(key) }}'
        {%- endif %}
        {%- endfor %}

  # iam:PermissionsBoundary is not a valid condition key for these actions, so they
  # are scoped by the project role path only.
  - Action:
      - iam:GetRole
      - iam:DeleteRole
      - iam:TagRole
      - iam:UntagRole
      - iam:ListAttachedRolePolicies
    Resource:
      - '{{ context.arns.get_project_role_arn() }}'
    Effect: Allow

  - Action:
      - iam:CreateInstanceProfile
      - iam:DeleteInstanceProfile
      - iam:GetInstanceProfile
      - iam:AddRoleToInstanceProfile
      - iam:RemoveRoleFromInstanceProfile
      - iam:TagInstanceProfile
    Resource:
      - '{{ context.arns.get_project_instance_profile_arn() }}'
    Effect: Allow

  # PassRole is required since AddRoleToInstanceProfile implicitly passes the role to ec2; scoped to the project role path and ec2 only.
  - Action:
      - iam:PassRole
    Resource:
      - '{{ context.arns.get_project_role_arn() }}'
    Effect: Allow
    Condition:
      StringEquals:
        iam:PassedToService: 'ec2.{{ context.config.get_string("cluster.aws.dns_suffix", required=True) }}'

  # The boundary policy is not under this path, so cluster-manager cannot rewrite
  # the ceiling it is required to attach.
  - Action:
      - iam:CreatePolicy
      - iam:CreatePolicyVersion
      - iam:DeletePolicy
      - iam:DeletePolicyVersion
      - iam:GetPolicy
      - iam:GetPolicyVersion
      - iam:ListPolicyVersions
      - iam:TagPolicy
    Resource:
      - '{{ context.arns.get_project_policy_arn() }}'
    Effect: Allow

  # The boundary document itself is read, not only its existence: the provisioner
  # compares an administrator supplied policy against it before attaching it.
  - Action:
      - iam:GetPolicy
      - iam:GetPolicyVersion
      - iam:ListPolicyVersions
    Resource:
      - '{{ context.arns.get_project_permissions_boundary_arn() }}'
    Effect: Allow

    {%- if context.config.get_list("cluster.iam.ec2_managed_policy_arns", []) %}
  # Read only, and only the policies cluster.iam.ec2_managed_policy_arns names, so a
  # grant the boundary would void is reported instead of attached and dead.
  - Action:
      - iam:GetPolicy
      - iam:GetPolicyVersion
      - iam:ListPolicyVersions
    Resource:
      {%- for policy_arn in context.config.get_list("cluster.iam.ec2_managed_policy_arns", []) %}
      - '{{ policy_arn }}'
      {%- endfor %}
    Effect: Allow
    {%- endif %}

  - Action:
      - bedrock:CreateInferenceProfile
    Resource:
      - '{{ context.arns.bedrock_application_inference_profile_arn }}'
      - '{{ context.arns.bedrock_system_inference_profile_arn }}'
      - '{{ context.arns.bedrock_foundation_model_arn }}'
    Effect: Allow

  # Only the profiles this module creates are deletable or taggable. The system
  # profile ARN is read only here, since it is the copyFrom source.
  - Action:
      - bedrock:DeleteInferenceProfile
      - bedrock:GetInferenceProfile
      - bedrock:TagResource
      - bedrock:ListTagsForResource
    Resource:
      - '{{ context.arns.bedrock_application_inference_profile_arn }}'
    Effect: Allow

  - Action:
      - bedrock:GetInferenceProfile
    Resource:
      - '{{ context.arns.bedrock_system_inference_profile_arn }}'
    Effect: Allow

  - Action:
      - bedrock:GetFoundationModel
    Resource:
      - '{{ context.arns.bedrock_foundation_model_arn }}'
    Effect: Allow

  # scoped to the one delivery role name (trailing wildcard covers the region suffix the Role construct appends); can only be passed to bedrock.
  - Action:
      - iam:PassRole
    Resource:
      - '{{ context.arns.get_arn("iam", "role/" + context.cluster_name + "-bedrock-invocation-logging-*", aws_region="") }}'
    Effect: Allow
    Condition:
      StringEquals:
        iam:PassedToService: 'bedrock.{{ context.config.get_string("cluster.aws.dns_suffix", required=True) }}'

  - Action:
      - logs:StartQuery
    Resource:
      - '{{ context.arns.bedrock_invocation_log_group_arn }}'
      - '{{ context.arns.bedrock_invocation_log_group_arn }}:*'
    Effect: Allow

  # the cost pages read desktops that no longer exist from the record the virtual
  # desktop controller writes when it terminates one. read only: the controller owns it.
  - Action:
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:DescribeTable
    Resource:
      - '{{ context.arns.get_ddb_table_arn(context.config.get_module_id("virtual-desktop-controller") + ".controller.session-history") }}'
    Effect: Allow

  - Action:
      - dynamodb:GetItem
      - dynamodb:Query
      - dynamodb:PutItem
      - dynamodb:DeleteItem
      - dynamodb:BatchWriteItem
      - dynamodb:DescribeTable
      - dynamodb:CreateTable
      - dynamodb:UpdateTimeToLive
      - dynamodb:TagResource
    Resource:
      - '{{ context.arns.get_ddb_table_arn("bedrock.usage") }}'
      - '{{ context.arns.get_ddb_table_arn("bedrock.instances") }}'
    Effect: Allow

    {% endif %}

{% include '_templates/custom-kms-key.yml' %}

  {% if context.config.get_string(context.module_id + '.accounts.reconcile.okta.api_token_secret_arn') %}
  - Action:
      - secretsmanager:GetSecretValue
    Resource: '{{ context.config.get_string(context.module_id + ".accounts.reconcile.okta.api_token_secret_arn") }}'
    Effect: Allow
    Sid: AccountReconcileOktaSecret
  {% endif %}

{% if context.config.get_string("ecs.cluster_name") %}
  # Read-only view of the control-plane services, scoped to the cluster; DescribeTaskDefinition
  # has no resource-level permissions. Kept to two statements: the role's inline policies share
  # a 10240-byte limit.
  - Effect: Allow
    Action:
      - ecs:ListServices
      - ecs:ListTasks
      - ecs:DescribeServices
      - ecs:DescribeTasks
    Resource: '*'
    Condition:
      ArnEquals:
        ecs:cluster: '{{ context.arns.get_arn("ecs", "cluster/" + context.config.get_string("ecs.cluster_name")) }}'
  - Effect: Allow
    Action:
      - ecs:DescribeTaskDefinition
    Resource: '*'
{% endif %}
