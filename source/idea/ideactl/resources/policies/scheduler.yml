Version: '2012-10-17'
Statement:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
    Resource: '{{ context.arns.get_ddb_table_arn("accounts.users") }}'

  - Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:Query
      - dynamodb:UpdateItem
    Resource:
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}'
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}/index/*'

  - Effect: Allow
    Action:
      - cognito-idp:AdminListGroupsForUser
    Resource: '{{ context.arns.user_pool_arn }}'

  # Read-only describes and the cluster configuration tables are in scheduler-read-only.yml, and the
  # compute image pipeline in scheduler-image-pipeline.yml: both render into managed policies on the
  # same roles, because the inline policies of a role share one 10,240-byte limit this file reached.

  - Condition:
      StringLikeIfExists:
        autoscaling:LaunchConfigurationName: '{{ context.cluster_name }}*'
    Action:
      - autoscaling:UpdateAutoScalingGroup
      - autoscaling:DeleteAutoScalingGroup
      - autoscaling:CreateAutoScalingGroup
      - autoscaling:DetachInstances
      - ec2:DeleteLaunchTemplate
      - ec2:CreateLaunchTemplate
      - fsx:CreateDataRepositoryTask
    Resource: '*'
    Effect: Allow

  - Action:
      - ec2:CreateTags
    Resource:
      - '{{ context.arns.get_arn("ec2", "volume/*", aws_region="*") }}'
      - '{{ context.arns.get_arn("ec2", "network-interface/*", aws_region="*") }}'
      - '{{ context.arns.get_arn("ec2", "instance/*", aws_region="*") }}'
      - '{{ context.arns.get_arn("ec2", "spot-instances-request/*", aws_region="*") }}'
    Effect: Allow

  - Action:
      - cloudformation:CreateStack
      - cloudformation:DeleteStack
      - cloudformation:DescribeStackResources
      - cloudformation:DescribeStacks
      - cloudformation:GetTemplate
    Resource: '*'
    Effect: Allow

  - Condition:
      ForAllValues:ArnEqualsIfExists:
        ec2:Vpc: '{{ context.arns.vpc_arn }}'
    Action:
      - ec2:RunInstances
      - ec2:StopInstances
      - ec2:StartInstances
      - ec2:TerminateInstances
      - ec2:CreatePlacementGroup
      - ec2:DeletePlacementGroup
      - ec2:ModifyInstanceAttribute
    Resource:
      {{ context.utils.to_yaml(context.arns.ec2_common_arns) | indent(6) }}
    Effect: Allow

  - Action:
      - lambda:InvokeFunction
    Resource:
      - '{{ context.arns.get_lambda_arn() }}'
    Effect: Allow

  - Action:
      - fsx:CreateFileSystem
      - fsx:TagResource
    Resource:
      - '{{ context.arns.get_arn("fsx", "file-system/*") }}'
    Effect: Allow

  - Condition:
      StringLike:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
    Action:
      - fsx:DeleteFileSystem
    Resource:
      - '{{ context.arns.get_arn("fsx", "file-system/*") }}'
    Effect: Allow

  - Action:
      - iam:CreateServiceLinkedRole
      - iam:AttachRolePolicy
      - iam:PutRolePolicy
    Resource:
      {{ context.utils.to_yaml(context.arns.service_role_arns) | indent(6) }}
    Effect: Allow

  - Condition:
      ForAllValues:ArnEqualsIfExists:
        ec2:Vpc: '{{ context.arns.vpc_arn }}'
    Action:
      - ec2:CreatePlacementGroup
      - ec2:DeletePlacementGroup
      - ec2:RequestSpotFleet
      - ec2:ModifySpotFleetRequest
      - ec2:CancelSpotFleetRequests
    Resource: '*'
    Effect: Allow

  - Action:
      - s3:GetObject
      - s3:ListBucket
      - s3:PutObject
      - s3:GetBucketAcl
    Resource:
      {{ context.utils.to_yaml(context.arns.s3_bucket_arns) | indent(6) }}
    Effect: Allow

  - Action:
      - dynamodb:TagResource
      - dynamodb:BatchGet*
      - dynamodb:DescribeStream
      - dynamodb:DescribeTable
      - dynamodb:Get*
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:BatchWrite*
      - dynamodb:CreateTable
      - dynamodb:Delete*
      - dynamodb:Update*
      - dynamodb:PutItem
    Resource:
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".queue-profiles") }}'
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".applications") }}'
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".license-resources") }}'
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".image-builds") }}'
    Effect: Allow

  - Condition:
      ForAllValues:ArnEqualsIfExists:
        ec2:Vpc: '{{ context.arns.vpc_arn }}'
    Action:
      - iam:PassRole
      - iam:CreateServiceLinkedRole
    Resource:
      - '{{ context.vars.compute_node_role_arn }}'
      - '{{ context.vars.spot_fleet_request_role_arn }}'
    Effect: Allow

{% if context.config.get_bool('ecs.enabled', default=False) %}
  # A container scheduler resolves cluster users from the account tables the cluster manager owns,
  # because it has no directory client of its own. The sync runs once before the module starts and
  # scans these three tables, so without this the task exits before it binds its port.
  - Action:
      - dynamodb:Scan
    Resource:
      - '{{ context.arns.get_ddb_table_arn("accounts.users") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.groups") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.group-members") }}'
    Effect: Allow
    Sid: ClusterUserSync
{% endif %}

  {% if context.config.get_bool(context.config.get_module_id('cluster-manager') + '.bedrock.enabled', False) and context.config.get_bool(context.module_id + '.bedrock.enabled', False) %}
  # scoped to roles under the per-project IAM path, passed only to ec2; enabling bedrock for jobs requires redeploying this module along with cluster-manager.
  - Condition:
      StringEquals:
        iam:PassedToService:
          - ec2.{{ context.aws_dns_suffix }}
    Action:
      - iam:PassRole
    Resource:
      - '{{ context.arns.get_project_role_arn() }}'
    Effect: Allow
    Sid: PassProjectRoles
  {% endif %}

  - Action:
      - cloudwatch:PutMetricData
    Resource: '*'
    Effect: Allow
    Condition:
      StringLike:
        cloudwatch:namespace: IDEA/*
  - Action:
      - iam:SimulatePrincipalPolicy
    Resource:
      - '{{ context.vars.scheduler_role_arn }}'
    Effect: Allow

  - Action:
      - secretsmanager:GetSecretValue
    Condition:
      StringEquals:
        secretsmanager:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        secretsmanager:ResourceTag/idea:ModuleName: scheduler
    Resource: '*'
    Effect: Allow

  - Action:
      - sqs:DeleteMessage
      - sqs:ReceiveMessage
      - sqs:SendMessage
      - sqs:GetQueueAttributes
      - sqs:ChangeMessageVisibility
      - sqs:GetQueueUrl
    Resource:
      - '{{ context.arns.get_sqs_arn(context.module_id + "-job-status-events") }}'
    Effect: Allow
    Sid: JobStatusEventsQueue

  - Action:
      - sqs:SendMessage
    Resource:
      - '{{ context.arns.get_sqs_arn(context.config.get_module_id("cluster-manager") + "-notifications.fifo") }}'
    Effect: Allow
    Sid: SendUserNotifications

  - Action:
      - logs:PutRetentionPolicy
    Resource: '*'
    Effect: Allow

  - Action:
      - kinesis:PutRecord
      - kinesis:PutRecords
    Resource:
      - '{{ context.arns.get_kinesis_arn() }}'
    Effect: Allow

{% if context.config.get_bool('scheduler.use_stable_server_name', default=False) or context.config.get_bool('ecs.enabled', default=False) %}
  # With a stable server name the scheduler owns its own DNS record and points it at
  # whichever host or task is running the server. The container path always has the stable name,
  # and the stack writes the row itself, so the flag alone is enough to grant the permission.
  - Effect: Allow
    Action: route53:ChangeResourceRecordSets
    Resource: '{{ context.arns.get_route53_hostedzone_arn() }}'
    Sid: SchedulerDnsRecord
{% endif %}

{% include '_templates/aws-managed-ad.yml' %}

{% include '_templates/openldap.yml' %}

{% include '_templates/activedirectory.yml' %}

{% include '_templates/custom-kms-key.yml' %}
