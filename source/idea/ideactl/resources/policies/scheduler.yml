Version: '2012-10-17'
Statement:
  - Effect: Allow
    Action:
      - dynamodb:GetItem
    Resource: '{{ context.arns.get_ddb_table_arn("accounts.users") }}'

  - Effect: Allow
    Action:
      - dynamodb:GetItem
      - dynamodb:Query
    Resource:
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}'
      - '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}/index/*'

  # A token's use is recorded; its owner, scope and expiry are written only by the cluster manager.
  - Effect: Allow
    Action:
      - dynamodb:UpdateItem
    Resource: '{{ context.arns.get_ddb_table_arn("cluster-manager.api-tokens") }}'
    Condition:
      ForAllValues:StringEquals:
        dynamodb:Attributes: [token_id, last_used_on]

  - Effect: Allow
    Action:
      - cognito-idp:AdminListGroupsForUser
    Resource: '{{ context.arns.user_pool_arn }}'

  # Read-only describes and the cluster configuration tables are in scheduler-read-only.yml, and the
  # compute image pipeline in scheduler-image-pipeline.yml: both render into managed policies on the
  # same roles, because the inline policies of a role share one 10,240-byte limit this file reached.

  - Condition:
      StringLikeIfExists:
        autoscaling:LaunchConfigurationName: '{{ context.cluster_name }}*'
    Action:
      - autoscaling:UpdateAutoScalingGroup
      - autoscaling:DeleteAutoScalingGroup
      - autoscaling:CreateAutoScalingGroup
      - autoscaling:DetachInstances
      - ec2:DeleteLaunchTemplate
      - ec2:CreateLaunchTemplate
    Resource: '*'
    Effect: Allow

  - Action:
      - ec2:CreateTags
    Resource:
      - '{{ context.arns.get_arn("ec2", "volume/*", aws_region="*") }}'
      - '{{ context.arns.get_arn("ec2", "network-interface/*", aws_region="*") }}'
      - '{{ context.arns.get_arn("ec2", "spot-instances-request/*", aws_region="*") }}'
    Effect: Allow

  # An instance is tagged by the call that launches it, or later only if it is already this
  # cluster's, so the ownership tags Run Command trusts cannot be put on another instance.
  - Action:
      - ec2:CreateTags
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      'Null':
        ec2:CreateAction: 'false'
    Effect: Allow
  - Action:
      - ec2:CreateTags
    Resource: '{{ context.arns.get_arn("ec2", "instance/*") }}'
    Condition:
      StringEquals:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
    Effect: Allow

  # Job stacks only: a stack is created carrying this cluster's job tags, and only a stack that
  # carries them is deleted. Module stacks share the name prefix and carry no StackType=job.
  - Action:
      - cloudformation:DescribeStackResources
      - cloudformation:DescribeStacks
      - cloudformation:GetTemplate
    Resource: '*'
    Effect: Allow
  - Action: cloudformation:CreateStack
    Resource: '*'
    Condition:
      StringEquals:
        aws:RequestTag/idea:ClusterName: '{{ context.cluster_name }}'
        aws:RequestTag/idea:StackType: job
    Effect: Allow
  - Action: cloudformation:DeleteStack
    Resource: '*'
    Condition:
      StringEquals:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        aws:ResourceTag/idea:StackType: job
    Effect: Allow

  - Condition:
      ForAllValues:ArnEqualsIfExists:
        ec2:Vpc: '{{ context.arns.vpc_arn }}'
    Action:
      - ec2:RunInstances
      - ec2:StopInstances
      - ec2:StartInstances
      - ec2:TerminateInstances
      - ec2:CreatePlacementGroup
      - ec2:DeletePlacementGroup
      - ec2:ModifyInstanceAttribute
    Resource:
      {{ context.utils.to_yaml(context.arns.ec2_common_arns) | indent(6) }}
    Effect: Allow

  - Action:
      - fsx:CreateFileSystem
      - fsx:TagResource
    Resource:
      - '{{ context.arns.get_arn("fsx", "file-system/*") }}'
    Effect: Allow

  - Condition:
      StringLike:
        aws:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
    Action:
      - fsx:DeleteFileSystem
    Resource:
      - '{{ context.arns.get_arn("fsx", "file-system/*") }}'
    Effect: Allow

  # service-linked roles only: IAM refuses attaching or putting policies on them, so creating
  # them is the one grant that does anything.
  - Action:
      - iam:CreateServiceLinkedRole
    Resource:
      {{ context.utils.to_yaml(context.arns.service_role_arns) | indent(6) }}
    Effect: Allow

  - Condition:
      ForAllValues:ArnEqualsIfExists:
        ec2:Vpc: '{{ context.arns.vpc_arn }}'
    Action:
      - ec2:CreatePlacementGroup
      - ec2:DeletePlacementGroup
      - ec2:RequestSpotFleet
      - ec2:ModifySpotFleetRequest
      - ec2:CancelSpotFleetRequests
    Resource: '*'
    Effect: Allow

  - Action:
      - s3:GetObject
      - s3:ListBucket
      - s3:GetBucketAcl
    Resource:
      {{ context.utils.to_yaml(context.arns.s3_bucket_arns) | indent(6) }}
    Effect: Allow
  # The scheduler writes its own host packages (job stacks, image builds) and its log archive
  # (send_logs_s3.sh), nothing else in the bucket.
  - Action: s3:PutObject
    Resource:
      - '{{ context.arns.s3_bucket_arns[1] }}/idea/{{ context.module_id }}/bootstrap/*'
      - '{{ context.arns.s3_bucket_arns[1] }}/logs/{{ context.module_id }}/*'
    Effect: Allow

  - Action:
      - dynamodb:TagResource
      - dynamodb:BatchGet*
      - dynamodb:DescribeStream
      - dynamodb:DescribeTable
      - dynamodb:Get*
      - dynamodb:Query
      - dynamodb:Scan
      - dynamodb:BatchWrite*
      - dynamodb:CreateTable
      - dynamodb:Delete*
      - dynamodb:Update*
      - dynamodb:PutItem
    Resource:
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".queue-profiles") }}'
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".applications") }}'
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".license-resources") }}'
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".image-builds") }}'
      - '{{ context.arns.get_ddb_table_arn(context.module_id + ".scratch-cleanup") }}'
    Effect: Allow

  - Condition:
      ForAllValues:ArnEqualsIfExists:
        ec2:Vpc: '{{ context.arns.vpc_arn }}'
    Action:
      - iam:PassRole
      - iam:CreateServiceLinkedRole
    Resource:
      - '{{ context.vars.compute_node_role_arn }}'
      - '{{ context.vars.spot_fleet_request_role_arn }}'
    Effect: Allow

  # A container scheduler resolves cluster users from the account tables the cluster manager owns,
  # because it has no directory client of its own. The sync runs once before the module starts and
  # scans these three tables, so without this the task exits before it binds its port.
  - Action:
      - dynamodb:Scan
    Resource:
      - '{{ context.arns.get_ddb_table_arn("accounts.users") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.groups") }}'
      - '{{ context.arns.get_ddb_table_arn("accounts.group-members") }}'
    Effect: Allow
    Sid: ClusterUserSync

  {% if context.config.get_bool(context.config.get_module_id('cluster-manager') + '.bedrock.enabled', False) and context.config.get_bool(context.module_id + '.bedrock.enabled', False) %}
  # scoped to roles under the per-project IAM path, passed only to ec2; enabling bedrock for jobs requires redeploying this module along with cluster-manager.
  - Condition:
      StringEquals:
        iam:PassedToService:
          - ec2.{{ context.aws_dns_suffix }}
    Action:
      - iam:PassRole
    Resource:
      - '{{ context.arns.get_project_role_arn() }}'
    Effect: Allow
    Sid: PassProjectRoles
  {% endif %}

  - Action:
      - cloudwatch:PutMetricData
    Resource: '*'
    Effect: Allow
    Condition:
      StringLike:
        cloudwatch:namespace: IDEA/*
  - Action:
      - iam:SimulatePrincipalPolicy
    Resource:
      - '{{ context.vars.scheduler_role_arn }}'
    Effect: Allow

  - Action:
      - secretsmanager:GetSecretValue
    Condition:
      StringEquals:
        secretsmanager:ResourceTag/idea:ClusterName: '{{ context.cluster_name }}'
        secretsmanager:ResourceTag/idea:ModuleName: scheduler
    Resource: '*'
    Effect: Allow

  - Action:
      - sqs:DeleteMessage
      - sqs:ReceiveMessage
      - sqs:SendMessage
      - sqs:GetQueueAttributes
      - sqs:ChangeMessageVisibility
      - sqs:GetQueueUrl
    Resource:
      - '{{ context.arns.get_sqs_arn(context.module_id + "-job-status-events") }}'
    Effect: Allow
    Sid: JobStatusEventsQueue

  - Action:
      - sqs:SendMessage
    Resource:
      - '{{ context.arns.get_sqs_arn(context.config.get_module_id("cluster-manager") + "-notifications.fifo") }}'
    Effect: Allow
    Sid: SendUserNotifications

  # Job log groups are created with their retention when the job is provisioned, so hosts need no
  # retention call (one group per job: /<cluster>/<scheduler>/job-*).
  - Action:
      - logs:CreateLogGroup
      - logs:PutRetentionPolicy
    Resource: '{{ context.arns.get_log_group_arn("/" + context.module_id + "/job-*") }}'
    Effect: Allow

  # A job stack created before 26.09.1 with anonymous metrics on carries a custom resource whose
  # service token is this function; deleting the stack invokes it with the scheduler's credentials.
  # cluster.ts keeps the function for exactly those stacks.
  - Action: lambda:InvokeFunction
    Resource: '{{ context.arns.get_lambda_arn("solution-metrics") }}'
    Effect: Allow

  - Action:
      - kinesis:PutRecord
      - kinesis:PutRecords
    Resource:
      - '{{ context.arns.get_kinesis_arn() }}'
    Effect: Allow

  # The scheduler points its stable DNS name at the task running the server, in the cluster's
  # private zone only (roles/scheduler.sh, IDEA_ROUTE53_ZONE_ID). Without the zone the script
  # makes no call.
  {% set zone = context.config.get_string('cluster.route53.private_hosted_zone_id') %}
  {% if zone %}
  - Effect: Allow
    Action: route53:ChangeResourceRecordSets
    Resource: 'arn:{{ context.config.get_string("cluster.aws.partition", required=True) }}:route53:::hostedzone/{{ zone }}'
    Sid: SchedulerDnsRecord
  {% endif %}

{% include '_templates/aws-managed-ad.yml' %}

{% include '_templates/openldap.yml' %}

{% include '_templates/activedirectory.yml' %}

{% include '_templates/custom-kms-key.yml' %}
