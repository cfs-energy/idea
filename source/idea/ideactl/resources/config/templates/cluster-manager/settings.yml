# Cluster Manager Settings

endpoints:
  external:
    priority: 12
    path_patterns: ['/{{ module_id }}/*']
  internal:
    priority: 12
    path_patterns: ['/{{ module_id }}/*']

server:
  enable_http: true
  hostname: 0.0.0.0
  port: 8443
  enable_tls: true
  tls_certificate_file: {{apps_mount_dir}}/{{cluster_name}}/certs/idea.crt
  tls_key_file: {{apps_mount_dir}}/{{cluster_name}}/certs/idea.key
  enable_unix_socket: true
  unix_socket_file: /run/idea.sock
  max_workers: 16
  enable_metrics: false
  graceful_shutdown_timeout: 10
  api_context_path: /{{ module_id }}
  web_resources_context_path: /

web_portal:
  title: 'Integrated Digital Engineering on AWS'
  logo: ~
  subtitle: ~
  copyright_text: 'Copyright {year} Amazon Inc. or its affiliates. All Rights Reserved.'

  # valid values: in-memory (recommended), local-storage
  # falls back to local-storage automatically when the browser can't activate a serviceworker (e.g. no valid tls cert)
  session_management: in-memory

  # front end default log level
  #  0: OFF
  #  1: ERROR
  #  2: WARN
  #  3: INFO
  #  4: DEBUG
  #  5: TRACE
  # log level can be overridden by user by setting the `idea.log-level` local storage key using browser console
  # eg. localStorage.setItem('idea.log-level', '4')
  default_log_level: 3

  # optional cached personal cost total displayed beside the signed-in user
  cost_ticker:
    enabled: false
    # valid values: wtd, mtd, qtd, ytd
    period: mtd

  # valid values: home, my-jobs, my-desktops, files, my-costs, reports
  default_landing_page: home

  # optional external dashboard embedded in the web portal via a sandboxed iframe.
  # the nav entry and page stay hidden unless enabled is true and url is an http(s) url.
  # url must be reachable from the user's browser and must permit framing by the web portal origin.
  custom_dashboard:
    enabled: false
    title: 'Dashboard'
    url: ~

# maintenance window notice, read live from the config store, so turning it on or off needs
# no redeploy. every portal page shows the banner while enabled is true, and the scheduler
# rejects new job submissions with the same message.
maintenance:
  enabled: false
  # plain text shown to users. no markup, no links.
  message: ''
  # optional ISO 8601 timestamp, e.g. '2026-09-15T18:00:00Z'. when set, the banner adds
  # "until <local time>". an offset-less value is read as UTC. left empty, no time is shown.
  ends_at: ''

oauth2_client:
  # cluster manager OAuth 2.0 client is used for managing authentication for web-portal (when single sign-on is disabled)
  # set the below to an appropriate value based on your requirements and security posture.
  # recommended value is between 12 and 24 hours. web-portal session will expire and user will need to log in again after this interval.
  refresh_token_validity_hours: 12

logging:
  logs_directory: /opt/idea/app/logs
  profile: production
  default_log_file_name: application.log

cloudwatch_logs:
  enabled: true

ec2:
  autoscaling:
    public: false
    instance_type: {{instance_type}}
    base_os: {{base_os}}
    instance_ami: {{instance_ami}}
    volume_size: {{volume_size}}
    volume_type: {{volume_type}}
    enable_detailed_monitoring: false
    min_capacity: 1
    max_capacity: 3
    cooldown_minutes: 5
    new_instances_protected_from_scale_in: false
    elb_healthcheck:
      # Specifies the time in minutes Auto Scaling waits before checking the health status of an EC2 instance that has come into service.
      grace_time_minutes: 15
    cpu_utilization_scaling_policy:
      target_utilization_percent: 80
      estimated_instance_warmup_minutes: 15
    rolling_update_policy:
      max_batch_size: 1
      min_instances_in_service: 1
      pause_time_minutes: 15
    # instance metadata access method
    metadata_http_tokens: "required"  # supported values are "required" for IMDSv2 or "optional" for IMDSv1

cache:
  long_term:
    max_size: 1000
    ttl_seconds: 86400 # 1 day
  short_term:
    max_size: 10000
    ttl_seconds: 600 # 10 minutes

notifications:
  # email notifications are supported at the moment. slack, sms and other channels will be supported in a future release.
  email:
    enabled: true

# nothing is provisioned while enabled is false. toggling it requires a redeploy of both
# cluster-manager and virtual-desktop-controller; disable per-project before disabling here.
# The account's spend and its ONTAP storage levels, published through metrics.provider by this
# module, so the same agent that collects the cluster's own metrics carries them.
metrics:
  cost:
    enabled: false                     # Cost Explorer: spend by module x project x owner, module x service, storage usage types; commercial partition only
    interval_hours: 6
    lookback_days: 3                   # trailing full days re-read on every run; Cost Explorer revises recent days
    module_tag: idea:ModuleId          # cost allocation tags, activated in Billing
    project_tag: idea:Project
    owner_tag: idea:JobOwner
    by_account: false                  # also module x linked account, when Cost Explorer here sees other accounts
  storage:
    enabled: {{ 'true' if 'fsx_netapp_ontap' in (storage_data_provider, storage_apps_provider) else 'false' }}                     # FSx for NetApp ONTAP quota reports and volumes, for every shared-storage entry carrying metrics credentials
    interval_minutes: 60
    verify_tls: false                  # FSx management endpoints present self-signed certificates

bedrock:
  enabled: false
  # empty by design: approving a model here subscribes this account to its marketplace
  # terms and pricing on first invocation. ids are region-specific.
  model_ids: []
  # one config per aws account and region, covering every bedrock caller there, not just
  # idea; left false, usage tracking reports zero spend silently.
  invocation_logging:
    manage_configuration: true         # false: never touch the account and region configuration
    log_retention_in_days: 30
    include_request_response_data: false  # true also delivers prompts and completions to the log group
  usage:
    enabled: true
    interval_minutes: 15               # how often invocation records are aggregated
    lookback_days: 2                   # trailing days recomputed on every run (must be <= log_retention_in_days)
    max_query_results: 10000
    query_timeout_seconds: 300
    retention_days: 400                # time to live on the usage rows (must exceed the 30 day reporting window)
    max_users_per_project: 50          # per-user rows returned with a project
  # off by default. spend is the project's actual bedrock cost from cost explorer, about a
  # day behind and never estimated; an exhausted budget blocks new desktops/jobs but does
  # not revoke access from one already running.
  budgets:
    enabled: false
    action: block                      # block: withhold model access and hold jobs. warn: report only
    warning_percent: 80                # report a warning at this percent of the limit

#
# Control Task Manager settings
#
task_manager:
  max_workers: 5    # Maximum number of task executor worker threads (Max 10)
  min_workers: 1    # Minimum number of task executor worker threads (Min 1)
  polling_messages_max: 1 # Max number of Messages to poll from SQS queue
  task_timeout_seconds: 120 # The supervisor replaces the process if a task exceeds this deadline.
  polling_visibility_timeout: 30 # Visibility timeout for SQS messages; the worker raises it to cover the task deadline
  sqs_wait_time: 20 # SQS polling / Wait time (in seconds). Used to active short or long SQS polling. (Min 0, Max 20)
  debug: false      # Debug task_manager (extra information in logs, logging profile must be 'debug' to see)

accounts:
  reconcile:
    enabled: false
    interval_minutes: 60
    dry_run: true
    reenable: true
    # Cap proposed disables / enabled users and read errors / checked users.
    max_disable_fraction: 0.25
    check_cognito: false
    okta:
      org_url: ~
      api_token_secret_arn: ~
