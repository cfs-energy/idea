# ECS Settings

# The ECS stack writes service and target group settings after deployment.
enabled: true
# Fresh installs on every partition default to this image; set it explicitly to use a mirror.
image: public.ecr.aws/s5o2b4m0/idea-control-plane:{{ idea_release_version }}

# Upgrade-only repository selection for images already using a release tag in that repository.
# GovCloud falls back to aws when unset; this map does not rewrite the initial image above.
image_repositories:
  aws: public.ecr.aws/s5o2b4m0/idea-control-plane
  aws-us-gov: ~

hosts:
  instance_type: m7g.xlarge
  # Four hosts at rest: one replica per host, and a two-task service's full deployment surge needs
  # four distinct hosts. The fifth is for host replacement and a surge that finds no room.
  min: 4
  max: 5
  volume_size: 60

tasks:
  bastion-host:
    cpu: 1024
    memory: 2048
    desired: 2
  cluster-manager:
    cpu: 256
    memory: 1024
    desired: 2
  vdc:
    cpu: 256
    memory: 1024
    desired: 2
  scheduler:
    cpu: 512
    memory: 2048
    desired: 1
  dcv-broker:
    cpu: 512
    memory: 4096
    desired: 2
  dcv-gateway:
    cpu: 256
    memory: 512
    desired: 2

# The metrics agent daemon on every host: on when the modules send to it (metrics_provider
# dogstatsd), from Datadog's official public ECR image pinned by digest unless the values name
# another digest-pinned image, with the API key read from Secrets Manager when a task starts.
datadog:
  enabled: {{ datadog_agent | default(false) | lower }}
  api_key_secret_arn: {{ datadog_api_key_secret_arn or '~' }}
  image: {{ datadog_agent_image or '~' }}
