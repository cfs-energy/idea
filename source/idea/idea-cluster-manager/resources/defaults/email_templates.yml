  - name: "virtual-desktop-controller.software-stack-expiry-digest"
    title: "Software Stacks Past or Near Their Expiry Date"
    template_type: jinja2
    subject: "[{{cluster_name}}] Software stacks that need a decision"
    body: |
      Hello <b>{{username}}</b>, <br><br>
      These software stacks are not rebuilt each month, and are past or near their expiry date:
      <ul>
      {% for stack in stacks %}<li><b>{{stack.name}}</b>: {% if stack.state == 'expired' %}expired{% else %}expires{% endif %} {{stack.expires_on}}</li>
      {% endfor %}</ul>
      {% if hiding %}Expired stacks are no longer offered for new desktops.{% else %}They are still offered for new desktops, with a warning.{% endif %} Desktops already running on them keep working.
      <br><br>
      <b>To keep one:</b> ask an administrator to extend it on the Software Stacks page, or to exempt its image.
      <br>
      <b>If you no longer need one:</b> ask an administrator to disable it. Nothing else is needed.
      <br>
      <br>
      <hr>
      <i> This is an automated email, once a week at most. Please do not respond.</i>
  - name: "virtual-desktop-controller.session-cleanup-warning"
    title: "Virtual Desktop Scheduled for Deletion"
    template_type: jinja2
    subject: "[{{cluster_name}}] Virtual Desktop {{session_name}} will be deleted on {{deletion_date}}"
    body: |
      Hello <b>{{session.owner}}</b>, <br><br>
      Your Virtual Desktop Session <b> {{session_name}} </b> has been stopped for {{stopped_days}} days and will be deleted on <b>{{deletion_date}}</b>.
      <br><br>
      <b>To keep it:</b> sign in to the web portal, open <b>Virtual Desktops</b>, and start <b>{{session_name}}</b> before that date. Starting it resets the clock, and using it keeps it out of the cleanup.
      <br>
      <b>If you no longer need it:</b> nothing to do. It is deleted on that date and stops costing storage.
      <br>
      <b>If it must stay stopped:</b> ask an administrator to exempt it from the stopped desktop cleanup.
      <br>
      <br>
      <hr>
      <i> This is an automated email, please do not respond.</i>
  - name: "virtual-desktop-controller.session-shared"
    title: "Virtual Desktop Shared"
    template_type: jinja2
    subject: "[{{cluster_name}}] Virtual Desktop shared with you"
    body: |
      Hello <b>{{session_permission.actor_name}}</b>, <br><br>
      This email is to notify you that Virtual Desktop <b>{{session_permission.idea_session_name}}</b> owned by <b>{{session_permission.idea_session_owner}}</b> has been shared with you.
      <br> You can access the session via the following url:
      <br> {{url}}
      <br> <br> Access to this virtual desktop expires on <b>{{formatted_expiry_date}}</b>
      <br>
      <hr>
      <i> This is an automated email, please do not respond.</i>
  - name: "virtual-desktop-controller.session-permission-updated"
